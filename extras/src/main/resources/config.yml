# Configuración de RPGRoll-Extras

# Idioma de los mensajes (jugador y comandos). Opciones: es, en, pt_BR.
# Los textos viven en lang/<idioma>.yml dentro de esta carpeta de datos —
# puedes editarlos ahí directamente. Tras cambiar esto, /extrasadmin reload.
language: es

# Menú del servidor: un ítem (una brújula por defecto) que abre menus/<menu>.yml
# con cualquier clic. Los menús usan el mismo formato que los de RPGRoll-NPCs:
# acciones COMMAND_AS_PLAYER, COMMAND, OPEN_GUI, MESSAGE, SOUND, TELEPORT...
# /menu lo abre sin el ítem y /menu item lo devuelve.
server-menu:
  enabled: false
  menu: servidor
  # Se entrega al entrar (en su casilla de la barra) si no lo lleva.
  give-on-join: true
  # No cae al morir: vuelve al reaparecer.
  keep-on-death: true
  # No se puede tirar, guardar en cofres ni cambiar de mano.
  locked: true
  item:
    material: COMPASS
    name: "&c&l✦ Brújula del Nether &7(clic)"
    lore:
      - "&7Viajes, tienda, pase y más."
      - "&8Clic con ella en la mano"
    slot: 8
    glint: true

# Jugadores AFK: tras este tiempo sin tocar nada (moverse, girar la cámara,
# chatear, golpear...) sus stats se congelan — la sed no baja, la fatiga no
# sube — hasta que vuelvan a hacer algo. Los umbrales ya alcanzados siguen
# aplicando sus efectos. Tras cambiarlo, /extrasadmin reload.
afk:
  pause-stats: true
  idle-seconds: 300 # 5 minutos

# Mundos donde las necesidades (sed, fatiga, estrés...) ni corren ni hacen daño: un lobby.
stats-disabled-worlds: []

# Velocidad de cada necesidad (id del archivo de stats/): multiplica lo que baja y lo que sube.
# 1 = normal, 2 = el doble de rápido, 0.5 = la mitad. Se cambia también desde /extrasadmin menu.
needs-speed: {}

# Ordenar: clic central o Shift + clic en una casilla vacía ordena ese cofre (o las 27 casillas de
# arriba de tu inventario); /ordenar ordena tu inventario y /ordenar off|on lo apaga para ti.
# Solo cofres, barriles, shulkers, tolvas, dispensadores, soltadores y el cofre de ender.
# Permiso: rpgrollextras.sort (todos).
inventory-sort:
  enabled: true
  # Varita de orden (un palo y un cofre en la mesa): clic derecho a un cofre lo ordena sin abrirlo;
  # al aire, ordena tu inventario. /ordenar varita la da (rpgrollextras.sort.admin).
  wand: true

# Teletransporte aleatorio: /rtp [mundo]. Apagado de fábrica: enciéndelo solo si no hay otro
# plugin de RTP. El chunk de destino se carga (y se genera, si hace falta) sin parar el servidor.
# Permisos: rpgrollextras.travel (usarlo, todos), .rtp.nodelay y .rtp.nocooldown.
# Encenderlo o apagarlo pide reiniciar; lo demás, /extrasadmin reload.
random-teleport:
  enabled: false
  # Segundos quieto antes de salir, y de espera entre un uso y el siguiente.
  delay-seconds: 3
  cooldown-seconds: 300
  # A dónde lleva /rtp a secas cuando el jugador no está ya en uno de los mundos de la lista.
  default-world: world
  # El anillo donde se cae, en bloques desde el centro del borde del mundo (que además lo limita).
  # Solo mundos con cielo: ni Nether ni cuevas.
  worlds:
    world:
      min-radius: 250
      max-radius: 3000

# /death: lleva al punto de tu última muerte, para recoger lo que se cayó antes de que
# desaparezca. Permiso: rpgrollextras.death (todos). Encenderlo o apagarlo pide reiniciar.
death-teleport:
  enabled: false

# Warps de jugador: /warp <nombre> viaja, /setwarp <nombre> fija uno donde estás,
# /delwarp <nombre> lo quita y /warps los lista. No se puede fijar donde el jugador no
# puede construir (el claim de otro, una región protegida) ni en disabled-worlds.
# Permisos: rpgrollextras.warp (todos) y rpgrollextras.warp.admin (sin límite, en
# cualquier sitio y borrar los de otros). Encenderlo o apagarlo pide reiniciar.
# Si otro plugin ya tiene /warp (Essentials), desactívalo allí (disabled-commands).
player-warps:
  enabled: false
  max-per-player: 2
  disabled-worlds: []

# Elevadores: bloque fabricable (8 de lana alrededor de una perla de ender en la mesa da
# recipe-amount). Saltar encima sube al siguiente elevador de la misma columna; agacharse baja.
# Necesita dos bloques libres encima del de destino y como mucho max-distance de separación.
# Un bloque igual puesto a mano no es un elevador: solo cuenta el fabricado.
elevator:
  enabled: true
  block: LIGHT_BLUE_GLAZED_TERRACOTTA
  max-distance: 32
  recipe-amount: 2

# Bloques reforzados. El Reforzador (obsidiana, lingote de hierro y palo en columna; 64 usos): clic
# derecho en un bloque ya puesto donde puedas construir y nada lo rompe, ni jugadores, explosiones,
# pistones, fuego, endermans, withers, agua ni desastres. Agachado + clic derecho en uno tuyo le
# quita el refuerzo. rpgrollextras.reinforce.admin (op) puede quitárselo a cualquiera.
reinforcement:
  enabled: true

# Cerraduras con código para cofres, barriles, puertas, trampillas y puertas de valla. Llave en
# blanco: lingote de hierro + pepita de oro. Agachado + clic derecho con ella en un bloque donde
# puedas construir: eliges un código de 4 dígitos y la llave queda grabada. Abre el dueño, quien
# lleve una llave con ese código o quien lo teclee. Copia: llave grabada + llave en blanco.
# Tras max-fails fallos seguidos, penalty-seconds sin poder teclear. Solo el dueño lo rompe;
# rpgrollextras.lock.admin (op) abre, rompe y quita cualquiera.
locks:
  enabled: true
  max-fails: 3
  penalty-seconds: 60

# Menús dibujados del paquete de recursos (warps). El menú del servidor (menus/*.yml) usa su
# propia clave background:. Vacío = menús de cofre normales. En Sackito: "sackito:menus".
menus:
  pack: ""
