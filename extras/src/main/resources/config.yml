# Configuración de RPGRoll-Extras

# Idioma de los mensajes (jugador y comandos). Opciones: es, en, pt_BR.
# Los textos viven en lang/<idioma>.yml dentro de esta carpeta de datos —
# puedes editarlos ahí directamente. Tras cambiar esto, /extrasadmin reload.
language: es

# Menú del servidor: un ítem (una brújula por defecto) que abre menus/<menu>.yml
# con cualquier clic. Los menús usan el mismo formato que los de RPGRoll-NPCs:
# acciones COMMAND_AS_PLAYER, COMMAND, OPEN_GUI, MESSAGE, SOUND, TELEPORT...
# /menu lo abre sin el ítem y /menu item lo devuelve.
server-menu:
  enabled: false
  menu: servidor
  # Se entrega al entrar (en su casilla de la barra) si no lo lleva.
  give-on-join: true
  # No cae al morir: vuelve al reaparecer.
  keep-on-death: true
  # No se puede tirar, guardar en cofres ni cambiar de mano.
  locked: true
  item:
    material: COMPASS
    name: "&c&l✦ Brújula del Nether &7(clic)"
    lore:
      - "&7Viajes, tienda, pase y más."
      - "&8Clic con ella en la mano"
    slot: 8
    glint: true

# Jugadores AFK: tras este tiempo sin tocar nada (moverse, girar la cámara,
# chatear, golpear...) sus stats se congelan — la sed no baja, la fatiga no
# sube — hasta que vuelvan a hacer algo. Los umbrales ya alcanzados siguen
# aplicando sus efectos. Tras cambiarlo, /extrasadmin reload.
afk:
  pause-stats: true
  idle-seconds: 300 # 5 minutos

# Mundos donde las necesidades (sed, fatiga, estrés...) ni corren ni hacen daño: un lobby.
stats-disabled-worlds: []

# Teletransporte aleatorio: /rtp [mundo]. Apagado de fábrica: enciéndelo solo si no hay otro
# plugin de RTP. El chunk de destino se carga (y se genera, si hace falta) sin parar el servidor.
# Permisos: rpgrollextras.travel (usarlo, todos), .rtp.nodelay y .rtp.nocooldown.
# Encenderlo o apagarlo pide reiniciar; lo demás, /extrasadmin reload.
random-teleport:
  enabled: false
  # Segundos quieto antes de salir, y de espera entre un uso y el siguiente.
  delay-seconds: 3
  cooldown-seconds: 300
  # A dónde lleva /rtp a secas cuando el jugador no está ya en uno de los mundos de la lista.
  default-world: world
  # El anillo donde se cae, en bloques desde el centro del borde del mundo (que además lo limita).
  # Solo mundos con cielo: ni Nether ni cuevas.
  worlds:
    world:
      min-radius: 250
      max-radius: 3000

# /death: lleva al punto de tu última muerte, para recoger lo que se cayó antes de que
# desaparezca. Permiso: rpgrollextras.death (todos). Encenderlo o apagarlo pide reiniciar.
death-teleport:
  enabled: false

# Warps de jugador: /warp <nombre> viaja, /setwarp <nombre> fija uno donde estás,
# /delwarp <nombre> lo quita y /warps los lista. No se puede fijar donde el jugador no
# puede construir (el claim de otro, una región protegida) ni en disabled-worlds.
# Permisos: rpgrollextras.warp (todos) y rpgrollextras.warp.admin (sin límite, en
# cualquier sitio y borrar los de otros). Encenderlo o apagarlo pide reiniciar.
# Si otro plugin ya tiene /warp (Essentials), desactívalo allí (disabled-commands).
player-warps:
  enabled: false
  max-per-player: 2
  disabled-worlds: []
