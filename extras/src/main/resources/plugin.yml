name: RPGRoll-Extras
version: 1.0.0
main: com.sack.rpgroll.extras.ExtrasPlugin
api-version: "26.1.1"
author: Sack
description: Necesidades y estados de supervivencia configurables (sed, stamina, fatiga, temperatura, oxígeno, estrés, condiciones custom) el menú del servidor (brújula) y mochilas mejorables para RPGRoll
depend: [RPGRoll-Lib]
softdepend: [RPGRoll, RPGRoll-TAB, RPGRoll-Seasons, RPGRoll-Items, PlaceholderAPI, Vault]

permissions:
  rpgrollextras.admin.*:
    description: Acceso completo a comandos administrativos de RPGRoll-Extras
    default: op
    children:
      rpgrollextras.menu.any: true
      rpgrollextras.backpack.admin: true
      rpgrollextras.backpack.bypass: true
  rpgrollextras.menu:
    description: Abrir el menú del servidor (/menu) y recuperar su brújula (/menu item)
    default: true
  rpgrollextras.menu.any:
    description: Abrir cualquier menú de menus/ con /menu <id>
    default: op
  rpgrollextras.backpack.use:
    description: Abrir mochilas (en la mano, en el inventario o puestas en el suelo)
    default: true
  rpgrollextras.backpack.bypass:
    description: Abrir y recoger mochilas ligadas a otros jugadores, y desligarlas
    default: op
  rpgrollextras.backpack.admin:
    description: Entregar mochilas con /mochila give
    default: op
