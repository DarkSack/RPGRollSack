# RPGRoll-Extras messages (/extrasadmin command)
# {placeholder} is substituted dynamically. Legacy (&) color codes preserved.

command:
  no-permission: "You don't have permission to use this command."
  usage:
    main: |-
      &eUsage: /extrasadmin
      &7 • &breload
      &7 • &alist
      &7 • &eget
      &7 • &dset
      &7 • &6add
      &7 • &9apply
      &7 • &cremove
    get: "Usage: /extrasadmin get <player> <stat>"
    set: "Usage: /extrasadmin set <player> <stat> <value>"
    add: "Usage: /extrasadmin add <player> <stat> <amount>"
    apply: "Usage: /extrasadmin apply <player> <condition>"
    remove: "Usage: /extrasadmin remove <player> <condition>"
  reload:
    success: "✔ RPGRoll-Extras reloaded: {stats} stat(s), {conditions} condition(s)."
  list:
    stats-header: "Stats:"
    conditions-header: "Conditions:"
  get:
    result: "{player} → {stat}: {value}"
  set:
    success: "✔ {stat} for {player} set to {value}"
  add:
    success: "✔ {stat} for {player} adjusted by {amount}"
  apply:
    success: "✔ Condition '{condition}' applied to {player}"
  remove:
    success: "✔ Condition '{condition}' removed from {player}"
  stat-not-found: "No stat exists with id: {stat}"
  condition-not-found: "No condition exists with id: {condition}"
  player-not-found: "Player not found: {player}"
  invalid-number: "Invalid numeric value: {value}"

server_menu:
  unknown: "&cThere is no menu «{id}»."
  no_permission: "&cYou can't open other menus."
  players_only: "&cThis command is for players only."
  disabled: "&7The server menu is disabled."
  item_given: "&a✔ Here is your compass."

backpack:
  placed_denied: "&cAnother player placed this backpack: only they can open it or pick it up."
  disabled: "&7Backpacks are disabled."
  no_permission: "&cYou are not allowed to use backpacks."
  not_owner: "&cThis backpack is bound to &e{owner}&c."
  break_denied: "&cThis backpack belongs to &e{owner}&c: you can't pick it up."
  busy: "&cSomeone else has this backpack open."
  forbidden: "&cThat can't be stored in a backpack."
  bound: "&a✔ Backpack bound to you: only you can open it."
  unbound: "&7Backpack unbound: anyone can open it."
  bind_denied: "&cOnly &e{owner}&c can unbind it."
  unknown_tier: "&cThere is no backpack tier «{tier}»."
  overflow: "&eThe backpack has fewer slots than before: {count} stack(s) went back to your inventory."
  unknown_player: "&cNo online player is called «{player}»."
  given: "&a✔ {amount}x {tier}&a for {player}."
  usage: "&eUsage: /mochila give <player> <tier> [amount] · /mochila list"
  list_header: "&6Backpack tiers:"
  list_line: "&7- &f{tier}&7: {name}&7, {slots} slots, recipe {recipe}"
