# Mensajes de RPGRoll-Extras (comando /extrasadmin)
# {placeholder} se reemplaza dinámicamente. Códigos de color legacy (&) preservados.

command:
  no-permission: "No tienes permiso para usar este comando."
  usage:
    main: |-
      &eUso: /extrasadmin
      &7 • &breload
      &7 • &alist
      &7 • &eget
      &7 • &dset
      &7 • &6add
      &7 • &9apply
      &7 • &cremove
    get: "Uso: /extrasadmin get <jugador> <stat>"
    set: "Uso: /extrasadmin set <jugador> <stat> <valor>"
    add: "Uso: /extrasadmin add <jugador> <stat> <cantidad>"
    apply: "Uso: /extrasadmin apply <jugador> <condition>"
    remove: "Uso: /extrasadmin remove <jugador> <condition>"
  reload:
    success: "✔ RPGRoll-Extras recargado: {stats} stat(s), {conditions} condition(s)."
  list:
    stats-header: "Stats:"
    conditions-header: "Conditions:"
  get:
    result: "{player} → {stat}: {value}"
  set:
    success: "✔ {stat} de {player} establecido en {value}"
  add:
    success: "✔ {stat} de {player} ajustado en {amount}"
  apply:
    success: "✔ Condition '{condition}' aplicada a {player}"
  remove:
    success: "✔ Condition '{condition}' removida de {player}"
  stat-not-found: "No existe una stat con id: {stat}"
  condition-not-found: "No existe una condition con id: {condition}"
  player-not-found: "Jugador no encontrado: {player}"
  invalid-number: "Valor numérico inválido: {value}"

server_menu:
  unknown: "&cNo existe el menú «{id}»."
  no_permission: "&cNo tienes permiso para abrir otros menús."
  players_only: "&cEste comando es solo para jugadores."
  disabled: "&7El menú del servidor está desactivado."
  item_given: "&a✔ Aquí tienes tu brújula."

backpack:
  placed_denied: "&cEsta mochila la puso otro jugador: solo él puede abrirla o recogerla."
  disabled: "&7Las mochilas están desactivadas."
  no_permission: "&cNo tienes permiso para usar mochilas."
  not_owner: "&cEsta mochila está ligada a &e{owner}&c."
  break_denied: "&cEsta mochila es de &e{owner}&c: no puedes recogerla."
  busy: "&cAlguien más tiene esta mochila abierta."
  forbidden: "&cEso no se puede guardar en una mochila."
  bound: "&a✔ Mochila ligada a ti: solo tú puedes abrirla."
  unbound: "&7Mochila desligada: cualquiera puede abrirla."
  bind_denied: "&cSolo &e{owner}&c puede desligarla."
  unknown_tier: "&cNo existe el nivel de mochila «{tier}»."
  overflow: "&eLa mochila tiene menos espacios que antes: {count} pila(s) volvieron a tu inventario."
  unknown_player: "&cNo hay ningún jugador conectado llamado «{player}»."
  given: "&a✔ {amount}x {tier}&a para {player}."
  usage: "&eUso: /mochila give <jugador> <nivel> [cantidad] · /mochila list"
  list_header: "&6Niveles de mochila:"
  list_line: "&7- &f{tier}&7: {name}&7, {slots} espacios, receta {recipe}"
