# Deshidratación (sección 15) — aplicada automáticamente por thirst.yml al llegar a 0.
# Duración indefinida (-1): se quita sola en cuanto la sed sube de 0 (bebiendo).
# Intervalos en TICKS (20 = 1 segundo).
id: dehydration
duration: -1
damage: 1
interval: 100 # 1 de daño cada 5 segundos
effects:
  - "slowness:0"
on-apply:
  - type: MESSAGE
    value: "&4Te estás deshidratando. &7Bebe algo: una botella de agua basta."
