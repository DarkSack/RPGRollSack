name: RPGRoll-Particles
version: 1.0.0
main: com.sack.rpgroll.sackeffects.SackEffectsPlugin
api-version: "26.1.1"
author: Sack
description: Librería de efectos (partículas con formas, sonidos, títulos/actionbar/bossbar, efectos de poción) reusable por cualquier plugin, similar en espíritu a SCore
depend: [RPGRoll]

commands:
  rpgparticles:
    description: Comandos administrativos de RPGRoll-Particles
    usage: /rpgparticles <browser|reload|test <id> [jugador]> [args]
    permission: rpgrollparticles.admin.*

permissions:
  rpgrollparticles.admin.*:
    description: Acceso completo a comandos administrativos de RPGRoll-Particles
    default: op
