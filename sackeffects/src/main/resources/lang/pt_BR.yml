# Arquivo de idioma: Português (Brasil)
# SackEffects - Sistema de mensagens

# Mensagens gerais
general:
  no_permission: "&cVocê não tem permissão para usar este comando."

# /sackeffects <browser|reload|test>
command:
  usage: "&cUso: /sackeffects <browser|reload|test <id> [jogador]>"
  browser_players_only: "&cSó jogadores podem abrir o navegador de efeitos."
  reload_success: "&a✔ Recarregado: {count} efeito(s)."
  test_usage: "&cUso: /sackeffects test <id> [jogador]"
