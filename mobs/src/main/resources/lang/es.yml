  info_category: "&7Categoría: {category} | Nivel: {level} | Rareza: {rarity}"
  info_stats: "&7Vida: {health} | Daño: {damage} | Defensa: {defense}"
  info_counts: "&7Fases: {phases} | Skills: {skills} | Loot: {loot}"
