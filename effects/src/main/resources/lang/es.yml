  level_max: "Nivel máximo permitido: {max} (tienes {level})."
  race: "Necesitas ser de la raza: {value}"
  class: "Necesitas ser de la clase: {value}"
  job: "Necesitas la profesión: {value}"
  world: "Tienes que estar en el mundo: {value}"
  weather: "Necesitas clima: {value}"
  time_range: "Solo disponible entre las {min} y {max} (hora del mundo)."
  health_below: "Necesitas tener menos de {percent}% de vida."
  health_above: "Necesitas tener más de {percent}% de vida."
  mana_below: "Necesitas tener menos de {percent}% de maná."
  mana_above: "Necesitas tener más de {percent}% de maná."
  guild_generic: "Necesitas pertenecer a un gremio."
  guild_specific: "Necesitas pertenecer a un gremio: {value}"
  team: "Necesitas estar en un equipo."
  permission: "No tienes el permiso requerido."

