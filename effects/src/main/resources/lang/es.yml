  remove_usage: "&cUso: /rpgeffects remove <id> <jugador>"
  remove_success: "&a✔ Removido '{id}' de {player}."
  remove_not_active: "&7{player} no tiene ese efecto activo."
  list_console_no_target: "&cLa consola no tiene un jugador por defecto — especifica uno: /rpgeffects list <jugador>"
