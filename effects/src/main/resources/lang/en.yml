  not_ready: "&cRPGRoll-Effects isn't ready yet."
  apply_blocked_header: "&c✘ Could not apply '{id}':"
  apply_blocked_reason: "&c  - {reason}"
  apply_success: "&a✔ Applied '{id}' to {player}."
  remove_usage: "&cUsage: /rpgeffects remove <id> <player>"
  remove_success: "&a✔ Removed '{id}' from {player}."
  remove_not_active: "&7{player} doesn't have that effect active."
  list_console_no_target: "&cThe console has no default player — specify one: /rpgeffects list <player>"
  list_no_active: "&7{player} has no active effects."
  list_header: "&6Active effects on {player}:"
  list_entry: "&f• {id} (stacks: {stacks}, remaining: {remaining})"
