# Language file: English
# RPGRoll-Effects - Message system

# General messages
general:
  no_permission: "&cYou don't have permission to use this command."

# /rpgeffects command
command:
  usage: |-
    &cUsage: /rpgeffects
    &7 • &bbrowser
    &7 • &areload
    &7 • &eapply <id> <player>
    &7 • &dremove <id> <player>
    &7 • &6list [player]
  browser_player_only: "&cOnly players can open the Effect Studio."
  reload_success: "&a✔ Reloaded: {count} effect(s)."
