  level_min: "You need level {min} (you have {level})."
  level_max: "Maximum allowed level: {max} (you have {level})."
  race: "You need to be of race: {value}"
  class: "You need to be of class: {value}"
  job: "You need the profession: {value}"
  world: "You need to be in the world: {value}"
  weather: "You need weather: {value}"
  time_range: "Only available between {min} and {max} (world time)."
  health_below: "You need to have less than {percent}% health."
  health_above: "You need to have more than {percent}% health."
  mana_below: "You need to have less than {percent}% mana."
  mana_above: "You need to have more than {percent}% mana."
  guild_generic: "You need to belong to a guild."
  guild_specific: "You need to belong to a guild: {value}"
