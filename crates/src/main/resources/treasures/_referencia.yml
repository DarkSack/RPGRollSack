# ============================================================================
# TESORO DE REFERENCIA — usa todos los campos de los tesoros enterrados. No se carga
# (los archivos que empiezan por _ se saltan): cópialo con otro nombre para usarlo.
#
# Cómo se juega:
#  1. Alguien consigue el mapa (/tesoro give, botín de un mob, recompensa de misión, una tienda...).
#  2. Clic derecho con el mapa: elige un punto a entre min-distance y max-distance bloques, en uno de los
#     biomas de la lista, y lo guarda en el mapa. Cada mapa tiene su propio punto.
#  3. Con el mapa en la mano, la barra de acción dice la distancia y el rumbo. Cerca, sale una X en el suelo.
#  4. Cavando hasta depth bloques bajo la superficie aparece el cofre (si el jugador puede romper ahí).
#     El mapa se gasta. Clic derecho en el cofre: el botín. Al cerrarlo, lo que quede cae al suelo.
# ============================================================================

id: tesoro_de_referencia
display-name: "&6Cofre de Referencia"

map:
  material: PAPER
  # Modelo del resource pack (namespace:id). Vacío: se ve como el material.
  model: ""
  name: "&eMapa del tesoro"
  lore:
    - "&7Una X dibujada a toda prisa."
    - "&8Clic derecho para leerlo."

placement:
  # Mundos por nombre. Vacío: cualquier mundo normal (no Nether ni End).
  worlds: []
  # Biomas (con o sin minecraft:). Vacío: cualquiera.
  biomes: [beach, snowy_beach, stony_shore]
  min-distance: 150
  max-distance: 600
  # Bloques bajo la superficie (1-32). El fondo del mar vale si hay 6 o menos de agua encima.
  depth: 3

chest:
  # Modelo del cofre (un ItemDisplay sobre una barrera). Vacío: un cofre vanilla.
  model: ""
  scale: 1.0
  rows: 3
  title: "&8Cofre de Referencia"
  # Acciones de lucky block al aparecer el cofre (MOB, COMMAND, SOUND, PARTICLE, MESSAGE...).
  # {player}, {x}, {y}, {z} y {world} se cambian por los del jugador y el cofre.
  guardians:
    - {type: MOB, entity: DROWNED, amount: 2}
    - {type: SOUND, sound: entity.elder_guardian.curse, volume: 0.6}

loot:
  # Tiradas: un número o un rango.
  rolls: 3-6
  entries:
    # item: material vanilla o id de RPGRoll-Items. amount: número o rango. weight: peso relativo.
    - {item: GOLD_INGOT, amount: 4-12, weight: 10}
    - {item: EMERALD, amount: 2-6, weight: 8}
    - {item: DIAMOND, amount: 1-3, weight: 3}
    - {item: HEART_OF_THE_SEA, weight: 1}

# Acciones de lucky block al abrir el cofre (MONEY, XP, COMMAND, TITLE, FIREWORK...).
actions:
  - {type: XP, amount: 50}
  - {type: MONEY, amount: 250-500}
