# Configuración de RPGRoll-Crates

# Idioma de los mensajes (jugador y comandos). Opciones: es, en, pt_BR.
# Los textos viven en lang/<idioma>.yml dentro de esta carpeta de datos —
# puedes editarlos ahí directamente. Tras cambiar esto, /crate reload.
language: es

# Lucky blocks (carpeta lucky/): se colocan con su ítem y se abren al romperlos.
# En el mundo son bloques musicales con instrumento de esqueleto, una nota por tipo;
# hace falta block-updates.disable-noteblock-updates: true en paper-global.yml.
lucky-blocks:
  # Mundos donde no se pueden colocar (por nombre).
  disabled-worlds: []

# Tesoros enterrados (carpeta treasures/): un mapa que, al leerlo, marca un punto del mundo; cavando
# allí aparece un cofre con su modelo, sus guardianes y su botín. /tesoro give <jugador> <id>.
treasures:
  enabled: true
  # Cada cuántos ticks se refresca la pista (distancia y rumbo) a quien lleva el mapa en la mano.
  hint-interval-ticks: 20
  # A esta distancia o menos se marca la X en el suelo y se dice cuánto cavar.
  mark-radius: 6

# Menús dibujados del paquete de recursos (fondos y botones).
# Vacío = menús de cofre normales. En Sackito: "sackito:menus".
menus:
  pack: ""
