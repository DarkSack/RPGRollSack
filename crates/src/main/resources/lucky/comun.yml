# Lucky block de ejemplo de RPGRoll-Crates. Se coloca con su ítem (/lucky give) y se abre al romperlo.
# En el mundo es un bloque musical con instrumento de esqueleto y esta nota (0-24, una por tipo):
# tu resource pack puede dibujar cada nota como un lucky block distinto. item.model es el modelo del
# ítem en tu pack (por ejemplo "miservidor:lucky_comun"); vacío, se ve como item.material.
#
# Resultados: weight relativo (/lucky outcomes <tipo> enseña el % de cada uno), luck GOOD, NEUTRAL
# o BAD (el aviso y el sonido), message opcional y announce: true para anunciarlo a todos.
# Acciones: DROP, RAIN, COMMAND, MONEY, XP, LUCKY, MOB, POTION, EXPLOSION, LIGHTNING, LAUNCH,
# CAGE, ARROWS, FIREWORK, MESSAGE, TITLE, SOUND y PARTICLE (parámetros en la documentación, "Crates").
# Las cantidades admiten rangos: amount: 2-5.

id: comun
display-name: "&eLucky Block"
lore:
  - "&7Rómpelo y prueba suerte."
  - "&8Casi siempre sale bien."
note: 0
item:
  material: PAPER
  model: ""
  glow: false

outcomes:
  - id: hierro
    weight: 12
    luck: GOOD
    message: "&aUn puñado de hierro."
    actions:
      - {type: DROP, item: IRON_INGOT, amount: 8-16}
  - id: oro
    weight: 9
    luck: GOOD
    message: "&aOro, oro, oro."
    actions:
      - {type: DROP, item: GOLD_INGOT, amount: 6-12}
  - id: diamantes
    weight: 7
    luck: GOOD
    message: "&b¡Diamantes!"
    actions:
      - {type: DROP, item: DIAMOND, amount: 1-3}
  - id: comida
    weight: 9
    luck: GOOD
    message: "&aUn buen almuerzo."
    actions:
      - {type: DROP, item: BREAD, amount: 16}
      - {type: DROP, item: COOKED_BEEF, amount: 8}
  - id: experiencia
    weight: 9
    luck: GOOD
    message: "&aExperiencia."
    actions:
      - {type: XP, amount: 30-60}
  - id: manzanas
    weight: 5
    luck: GOOD
    message: "&6Manzanas doradas."
    actions:
      - {type: DROP, item: GOLDEN_APPLE, amount: 2}
  - id: pico
    weight: 5
    luck: GOOD
    message: "&aUn pico de hierro encantado."
    actions:
      - {type: DROP, item: IRON_PICKAXE, amount: 1, enchantments: "efficiency:2,unbreaking:2"}
  - id: lluvia_esmeraldas
    weight: 4
    luck: GOOD
    message: "&a¡Llueven esmeraldas!"
    actions:
      - {type: RAIN, item: EMERALD, amount: 10}
  - id: doble
    weight: 3
    luck: GOOD
    message: "&e¡Dos lucky blocks más!"
    actions:
      - {type: LUCKY, lucky: comun, amount: 2}
  - id: fiesta
    weight: 5
    luck: NEUTRAL
    message: "&d¡Fiesta!"
    actions:
      - {type: FIREWORK, amount: 4}
      - {type: DROP, item: CAKE, amount: 1}
  - id: tierra
    weight: 4
    luck: NEUTRAL
    message: "&7Tierra. Mucha tierra."
    actions:
      - {type: DROP, item: DIRT, amount: 64}
  - id: zombis
    weight: 7
    luck: BAD
    message: "&c¡Zombis!"
    actions:
      - {type: MOB, entity: ZOMBIE, amount: 2-3}
  - id: "telarañas"
    weight: 4
    luck: BAD
    message: "&cAtrapado en telarañas."
    actions:
      - {type: CAGE, block: COBWEB, seconds: 5}
  - id: tnt
    weight: 4
    luck: BAD
    message: "&c¡Corre!"
    actions:
      - {type: EXPLOSION, power: 3, delay: 50}
  - id: diamantes_falsos
    weight: 4
    luck: BAD
    message: "&7...¿diamantes?"
    actions:
      - {type: DROP, item: DIAMOND, amount: 6, fake: true}
  - id: hambre
    weight: 3
    luck: BAD
    message: "&cDe repente, mucha hambre."
    actions:
      - {type: POTION, effect: hunger, seconds: 20, level: 2}
  - id: despegue
    weight: 3
    luck: BAD
    message: "&c¡Despegue!"
    actions:
      - {type: LAUNCH, power: 1.6}
