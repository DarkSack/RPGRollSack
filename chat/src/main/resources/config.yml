# Idioma de los mensajes (jugador y comandos). Opciones: es, en, pt_BR.
# Los textos viven en lang/<idioma>.yml dentro de esta carpeta de datos —
# podés editarlos ahí directamente. Tras cambiar esto, /chatadmin reload.
language: es

antispam:
  flood-max-messages: 5
  flood-window-millis: 10000
  repetition-threshold: 3
  max-caps-percent: 70
  min-length-for-caps-check: 8
  banned-words: []
  ad-keywords:
    - "discord.gg"
    - "www."
    - "http://"
    - "https://"
    - ".com"
    - ".net"

replacements:
  ":)": "🙂"
  ":(": "🙁"
  "<3": "❤"
