name: RPGRoll-Chat
version: 1.0.0
main: com.sack.rpgroll.chat.ChatPlugin
api-version: "26.1.1"
author: Sack
description: Motor de chat modular de RPGRoll — canales, proximidad, idiomas, roles, formatos dinámicos, whisper, antispam, reacciones y logs
depend: [RPGRoll]
softdepend: [RPGRoll-Guilds, PlaceholderAPI]

permissions:
  rpgrollchat.admin.*:
    description: Acceso completo a comandos administrativos de chat
    default: op
  rpgrollchat.staff:
    description: Acceso a logs de chat y moderación
    default: op
  rpgrollchat.socialspy:
    description: Ver whispers ajenos
    default: op
