# RPGRoll-TAB messages (/tabadmin command)
# {placeholder} is replaced dynamically. Legacy (&) color codes preserved.

command:
  no-permission: "You don't have permission to use this command."
  usage: |-
    Usage: /tabadmin
    &7 • &breload
    &7 • &alist
    &7 • &eprofile <player> <profile>
  reload:
    success: "✔ RPGRoll-TAB reloaded: {profiles} profile(s), {contexts} context(s)."
  list:
    empty: "No profiles are defined."
    header: "Available profiles:"
    entry: "• {id}"
  profile:
    usage: "Usage: /tabadmin profile <player> <profile>"
    player-not-found: "Player not found: {player}"
    profile-not-found: "No profile exists with id: {profile}"
    success: "✔ {player}'s profile forced to: {profile}"

# /tab menu: each player shows or hides blocks of their own header and footer.
options:
  title: "Your TAB"
  shown: "&aShown"
  hidden: "&cHidden"
  click_hide: "&7Click to hide it"
  click_show: "&7Click to show it"
  close: "&cClose"
  none: "&7Your TAB has nothing you can hide."
  players_only: "Only a player can use /tab."
  # Button name of each block (the key is the "block" of the tablist lines).
  blocks:
    personaje: "&eYour character"
    progreso: "&aLevel progress"
    dinero: "&6Money and guild"
    servidor: "&bServer info"
