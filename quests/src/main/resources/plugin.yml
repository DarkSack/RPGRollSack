name: RPGRoll-Quests
version: 1.0.0
main: com.sack.rpgroll.quests.QuestsPlugin
api-version: "1.21"
author: Sack
description: Motor de misiones ramificadas, componible por stages/objetivos/condiciones/eventos para RPGRoll
depend: [RPGRoll]
softdepend: [PlaceholderAPI]

commands:
  quest:
    description: Comandos de misiones para jugadores
    usage: /quest <list|info|start|abandon|track|active|completed> [args]
  questadmin:
    description: Comandos administrativos de misiones
    usage: /questadmin <give|complete|fail|reset|reload|browser [quests|regions]> [args]
    permission: rpgrollquests.admin.*

permissions:
  rpgrollquests.admin.*:
    description: Acceso completo a comandos administrativos de misiones
    default: op
