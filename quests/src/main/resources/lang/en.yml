# Language file: English
# RPGRoll-Quests - Message system

# General messages
general:
  no_permission: "&cYou don't have permission to use this command."
  player_only: "&cOnly a player can use this command."

# /questadmin command
admin:
  usage: |-
    &cUsage: /questadmin
    &7 • &bgive
    &7 • &acomplete
    &7 • &efail
    &7 • &dreset
    &7 • &6reload
    &7 • &9browser [quests|regions]
    &8   [player] [questId]
  browser_player_only: "&cOnly a player can open the browser."
  give_usage: "&cUsage: /questadmin give <player> <questId>"
  player_not_found: "&cPlayer not found: {player}"
  quest_not_found: "&cNo quest exists with id: {id}"
  give_success: "&a✔ Quest '{quest}' started for {player}"
  complete_usage: "&cUsage: /questadmin complete <player> <questId>"
  complete_success: "&a✔ Quest '{quest}' completed for {player}"
  complete_not_active: "&c{player} doesn't have that quest active."
  fail_usage: "&cUsage: /questadmin fail <player> <questId>"
  fail_success: "&a✔ Quest '{quest}' marked as failed for {player}"
  reset_usage: "&cUsage: /questadmin reset <player> <questId>"
  reset_success: "&a✔ Progress on '{quest}' reset for {player}"
  reload_success: "&a✔ Reloaded: {count} quest(s)."

# /quest command (player)
command:
  usage: |-
    &cUsage: /quest
    &7 • &blist
    &7 • &ainfo
    &7 • &estart
    &7 • &dabandon
    &7 • &6active
    &7 • &9completed
    &8   [id]
  list_empty: "&7No quests defined."
  list_header: "&6Available quests:"
  list_entry: "&f• {id} — {name} ({category}, {difficulty})"
  info_usage: "&cUsage: /quest info <id>"
  quest_not_found: "&cNo quest exists with id: {id}"
  info_title: "&6{name}"
  info_category: "&7Category: {category}"
  info_difficulty: "&7Difficulty: {difficulty}"
  info_stages: "&7Stages: {count}"
  info_repeatable_yes: "&7Repeatable: yes"
  info_repeatable_no: "&7Repeatable: no"
  start_usage: "&cUsage: /quest start <id>"
  start_success: "&a✔ Quest started: {name}"
  start_denied_header: "&cYou can't start this quest:"
  start_denied_reason: "&c- {reason}"
  abandon_usage: "&cUsage: /quest abandon <id>"
  abandon_success: "&a✔ Quest abandoned."
  abandon_not_active: "&cYou don't have that quest active."
  active_empty: "&7You have no active quests."
  active_header: "&6Active quests:"
  active_entry: "&f• {name} — stage {current}/{total} ({stageId})"
  completed_empty: "&7You haven't completed any quest yet."
  completed_header: "&6Completed quests: {count}"
  completed_entry: "&f• {id}"

# Quest engine (rejection reasons, dialog, completion messages)
engine:
  already_active: "You already have this quest active."
  already_completed_not_repeatable: "You already completed this quest and it's not repeatable."
  on_cooldown: "This quest is still on cooldown."
  dialog_npc_prefix: "&e[NPC] "
  dialog_player_prefix: "&b[You] "
  dialog_choose_option: "&6Choose an option:"
  quest_completed: "&6✔ Quest completed: {name}"

# Rejection reasons when checking whether a player can start a quest
requirement:
  level: "You need level {required} (you have {current})."
  race: "You need to be of the race: {race}"
  class: "You need to be of the class: {class}"
  profession: "You need the profession: {profession}"
  trait: "You need the trait: {trait}"
  permission: "You don't have the permission required for this quest."
  money: "You need at least {amount} money."
  item: "You need {amount}x {material}"
  completed_quest: "You need to have completed the quest: {quest}"
  world: "You need to be in the world: {world}"
  region: "You need to be in the region: {region}"
  biome: "You need to be in the biome: {biome}"
  weather: "You need weather: {weather}"
  time_range: "Only available between {min} and {max} (world time)."

# Objective listener (KILL_ENTITY, BREAK_BLOCK, DELIVER_ITEM, etc.)
listener:
  deliver_missing_items: "&cYou need {required}x {material} to deliver."

