# GUI: navegador de regiões
region_browser:
  title: "&6Regiões RPGRoll"
  world_label: "&7Mundo: {world}"
  click_to_edit: "&eClique para editar"
  create_new: "&aCriar nova região (aqui)"
  close_button: "Fechar"
  prompt_new_id: "Digite o id da nova região:"
