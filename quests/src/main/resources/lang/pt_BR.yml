  repeatable_yes: "&aRepetível: sim"
  repeatable_no: "&7Repetível: não"
  click_to_toggle: "&7Clique para alternar"
  cooldown_label: "&eCooldown: {seconds}s"
  cooldown_hint: "&7Clique: +1h · Clique direito: -1h"
  level_label: "&eNível necessário: {level}"
  click_plus_minus_1: "&7Clique: +1 · Clique direito: -1"
  reward_money_label: "&eRecompensa em ouro: {money}"
  click_plus_minus_50: "&7Clique: +50 · Clique direito: -50"
  reward_xp_label: "&eRecompensa de XP: {xp}"
  stage_entry: "{index}. {id}"
  stage_objectives: "&7{count} objetivo(s)"
  shift_click_remove: "&8Shift-click para remover"
  stage_yaml_hint: "&8Objetivos/diálogo ainda são editados no YAML"
  add_stage: "&aAdicionar stage (por id)"
  back_button: "Voltar"
  prompt_name: "Digite o novo nome da quest:"
