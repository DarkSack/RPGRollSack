# GUI: editor de região
region_editor:
  title: "&6Região: {id}"
  world_label: "&eMundo: {world}"
  click_use_current_world: "&7Clique para usar seu mundo atual"
  set_min_corner: "&cDefinir canto mínimo aqui"
  set_max_corner: "&aDefinir canto máximo aqui"
  coords: "&7{x}, {y}, {z}"
  volume_label: "&eVolume: {volume} bloco(s)³"
  back_button: "Voltar"

# Sistema de perguntas por chat (usado pelas GUIs de admin)
prompt:
  cancel_keyword: "cancelar"
  footer: "&7Digite no chat, ou '{keyword}' para abortar."
  cancelled: "&cCancelado."
