name: RPGRoll-Items
version: 1.0.0
main: com.sack.rpgroll.items.ItemsPlugin
api-version: "26.1.1"
author: Sack
description: Motor de ítems personalizados (componentes, stats, sockets, skins, mejoras, recetas) para RPGRoll
depend: [RPGRoll]
softdepend: [RPGRoll-FX, RPGRoll-Enchantments, Vault, "PlaceholderAPI", SackResourcePack]

permissions:
  rpgrollitems.admin.*:
    description: Acceso completo a comandos administrativos de ítems
    default: op
