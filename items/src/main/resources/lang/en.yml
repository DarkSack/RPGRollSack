# Language file: English
# RPGRoll-Items - Message system

general:
  no_permission: "&cYou don't have permission to use this command."

# Generic prompts from the chat-capture system (ChatPromptManager)
prompt:
  instructions: "&7Type in chat, or 'cancelar' to abort."
  cancelled: "&cCancelled."

# /itemadmin command
command:
  itemadmin:
    usage: |-
      &cUsage: /itemadmin
      &7 • &fgive
      &7 • &flist
      &7 • &freload
      &7 • &fcreate
      &7 • &fbrowser
      &7 • &feditor
    player_only: "&cOnly a player can use this."
    reload:
      success: "&a✔ Reloaded: {count} item(s)."
    create:
      player_only: "&cOnly a player can create an item."
      usage: "&cUsage: /itemadmin create <id> [pack] (omit [pack] to pick/create one from a menu)"
      already_exists: "&cAn item with that id already exists."
      success: "&a✔ Item '{id}' created — configure it in the editor."
    give:
      usage: "&cUsage: /itemadmin give <player> <id> [amount]"
      player_not_found: "&cPlayer not found: {player}"
      item_not_found: "&cNo item exists with id: {id}"
      invalid_amount: "&cThe amount must be a valid number."
      amount_range: "&cThe amount must be between 1 and {max}."
      success: "&a✔ {amount}x '{id}' given to {player}{overflow}"
      overflow_suffix: " (inventory full — the leftover was dropped on the ground)"
    list:
      empty: "&7No items are defined."
      header: "&6Available items:"
      entry: "&f• {id} ({pack}, {rarity})"
    editor:
      usage: "&cUsage: /itemadmin editor <id>"
      not_found: "&cNo item exists with id: {id}"
  item:
    player_only: "Only a player can use this command."
    usage: |-
      &cUsage: /item
      &7 • &finfo
      &7 • &fupgrade
      &7 • &fskin
      &7 • &fsocket
    no_item: "&cYou're not holding an RPGRoll-Items item."
    info:
      pack: "&7Pack: {pack}"
      rarity: "&7Rarity: {rarity}"
      upgrade_level: "&7Upgrade level: {level}"
      durability: "&7Durability: {current}/{max}"
    upgrade:
      ok: "&a✔ Item upgraded."
      max_level: "&cThis item is already at its maximum level."
      no_upgrade_defined: "&cThe next upgrade level isn't defined yet."
      cant_afford_money: "&cYou don't have enough money for this upgrade."
      missing_material: "&cYou're missing the material required for this upgrade."
    skin:
      none: "&cThis item has no alternate skins."
      changed: "&a✔ Skin changed to: {skin}"
      base: "base appearance"
    socket:
      none: "&cThis item has no sockets."
      usage: "&cUsage: /item socket <id> (with the gem in your off hand)"
      ok: "&a✔ Gem inserted."
      not_found: "&cThat item has no socket with id: {id}"
      already_filled: "&cThat socket already has a gem."
      type_not_accepted: "&cThat socket doesn't accept this type of gem."
      gem_not_found: "&cYou need a valid gem in your off hand."

# Chrome lore generated by ItemFactory for any RPGRoll item
item:
  durability_lore: "&7Durability: {current}/{max}"
  socket_empty: "&8[Empty socket]"
  socket_filled: "&b[Gem: {gem}]"

# Physical gem ItemStack (GemItem)
gem:
  lore_type: "&7Gem: {type}"
  lore_instructions: "&8Right-click a socket to insert."

# ItemEquipTask: unmet-requirements notice on equip
equip:
  requirements_header: "&cYou don't meet the requirements for {item}:"
  requirement_line: "&c- {reason}"

# ItemRequirementChecker: individual reasons (shown via equip.requirement_line)
requirement:
  level: "You need level {level} (you have {current})."
  race: "You need to be of the race: {race}"
  class: "You need to be of the class: {class}"
  profession: "You need the profession: {profession}"
  trait: "You need the trait: {trait}"
  skill: "You need the skill: {skill}"
  permission: "You don't have the required permission."
  money: "You need at least {amount} money."

# Active ability cooldown (ItemTriggerListener)
ability:
  cooldown: "&c{ability} is on cooldown ({seconds}s)."

# DurabilityService
durability:
  broken: "&cYour {item} broke."

# Navigation GUIs (outside the editor)
gui:
  browser:
    title: "&6RPGRoll Items"
    prev: "&e« Previous"
    next: "&eNext »"
    search_label: "&bSearch"
    no_filter: "&7(no filter)"
    filter: "&7Filter: {text}"
    all_categories: "&bAll categories"
    clear_search: "&cClear search"
    create_new: "&aCreate new item"
    received: "&a✔ You received: {item}"
    prompt_search: "Type part of the item's name or id:"
    prompt_new_item: "Type the id of the new item (e.g. flame_blade):"
    invalid_id: "&cInvalid or already existing id."
  rarity_picker:
    title: "&6Choose a rarity"
    id_lore: "&7id: {id}"
    glow_yes: "&7Glow: yes"
    glow_no: "&7Glow: no"
  material_picker:
    title: "&6Choose a material"
    prev: "&e« Previous"
    next: "&eNext »"
    search: "&bSearch"
    no_filter: "&7(no filter)"
    filter: "&7Filter: {text}"
    clear_filter: "&cClear filter"
    prompt_search: "Type part of the material's name (e.g. sword):"

