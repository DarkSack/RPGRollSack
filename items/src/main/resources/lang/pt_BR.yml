# Arquivo de idioma: Português (Brasil)
# RPGRoll-Items - Sistema de mensagens

general:
  no_permission: "&cVocê não tem permissão para usar este comando."

# Prompts genéricos do sistema de captura de chat (ChatPromptManager)
prompt:
  instructions: "&7Digite no chat, ou 'cancelar' para abortar."
  cancelled: "&cCancelado."

# Comando /itemadmin
command:
  itemadmin:
    usage: |-
      &cUso: /itemadmin
      &7 • &bgive
      &7 • &alist
      &7 • &ereload
      &7 • &dcreate
      &7 • &6browser
      &7 • &9editor
    player_only: "&cSó um jogador pode usar isso."
    reload:
      success: "&a✔ Recarregado: {count} item(ns)."
    create:
      player_only: "&cSó um jogador pode criar um item."
      usage: "&cUso: /itemadmin create <id> [pack] (omita [pack] para escolher/criar um em um menu)"
      already_exists: "&cJá existe um item com esse id."
      success: "&a✔ Item '{id}' criado — configure-o no editor."
    give:
      usage: "&cUso: /itemadmin give <jogador> <id> [quantidade]"
      player_not_found: "&cJogador não encontrado: {player}"
      item_not_found: "&cNão existe um item com id: {id}"
      invalid_amount: "&cA quantidade deve ser um número válido."
      amount_range: "&cA quantidade deve estar entre 1 e {max}."
      success: "&a✔ {amount}x '{id}' entregue a {player}{overflow}"
      overflow_suffix: " (inventário cheio — o excedente caiu no chão)"
    list:
      empty: "&7Não há itens definidos."
      header: "&6Itens disponíveis:"
      entry: "&f• {id} ({pack}, {rarity})"
    editor:
      usage: "&cUso: /itemadmin editor <id>"
      not_found: "&cNão existe um item com id: {id}"
  item:
    player_only: "Só um jogador pode usar este comando."
    usage: |-
      &cUso: /item
      &7 • &binfo
      &7 • &aupgrade
      &7 • &eskin
      &7 • &dsocket
    no_item: "&cVocê não está com um item de RPGRoll-Items na mão."
    info:
      pack: "&7Pack: {pack}"
      rarity: "&7Raridade: {rarity}"
      upgrade_level: "&7Nível de melhoria: {level}"
      durability: "&7Durabilidade: {current}/{max}"
    upgrade:
      ok: "&a✔ Item melhorado."
      max_level: "&cEste item já está no nível máximo."
      no_upgrade_defined: "&cO próximo nível de melhoria ainda não está definido."
      cant_afford_money: "&cVocê não tem dinheiro suficiente para esta melhoria."
      missing_material: "&cFalta o material necessário para esta melhoria."
    skin:
      none: "&cEste item não tem skins alternativas."
      changed: "&a✔ Skin alterada para: {skin}"
      base: "aparência base"
    socket:
      none: "&cEste item não tem sockets."
      usage: "&cUso: /item socket <id> (com a gema na sua mão secundária)"
      ok: "&a✔ Gema inserida."
      not_found: "&cEsse item não tem um socket com id: {id}"
      already_filled: "&cEsse socket já tem uma gema."
      type_not_accepted: "&cEsse socket não aceita esse tipo de gema."
      gem_not_found: "&cVocê precisa de uma gema válida na sua mão secundária."

# Lore/chrome gerado pelo ItemFactory para qualquer item RPGRoll
item:
  durability_lore: "&7Durabilidade: {current}/{max}"
  socket_empty: "&8[Socket vazio]"
  socket_filled: "&b[Gema: {gem}]"

# ItemStack físico de uma gema (GemItem)
gem:
  lore_type: "&7Gema: {type}"
  lore_instructions: "&8Clique direito em um socket para inserir."

# ItemEquipTask: aviso de requisitos não cumpridos ao equipar
equip:
  requirements_header: "&cVocê não cumpre os requisitos de {item}:"
  requirement_line: "&c- {reason}"

# ItemRequirementChecker: motivos individuais (exibidos via equip.requirement_line)
requirement:
  level: "Você precisa do nível {level} (você tem {current})."
  race: "Você precisa ser da raça: {race}"
  class: "Você precisa ser da classe: {class}"
  profession: "Você precisa da profissão: {profession}"
  trait: "Você precisa do traço: {trait}"
  skill: "Você precisa da habilidade: {skill}"
  permission: "Você não tem a permissão necessária."
  money: "Você precisa de pelo menos {amount} de dinheiro."

# Cooldown de habilidade ativa (ItemTriggerListener)
ability:
  cooldown: "&c{ability} em cooldown ({seconds}s)."

# DurabilityService
durability:
  broken: "&cSeu {item} quebrou."

# GUIs de navegação (fora do editor)
