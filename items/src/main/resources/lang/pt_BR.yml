    prompt_new_item: "Digite o id do novo item (ex. flame_blade):"
    invalid_id: "&cId inválido ou já existente."
  rarity_picker:
    title: "&6Escolha uma raridade"
    id_lore: "&7id: {id}"
    glow_yes: "&7Brilho: sim"
    glow_no: "&7Brilho: não"
  material_picker:
