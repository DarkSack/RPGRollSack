# Archivo de idioma: Español
# RPGRoll-Items - Sistema de mensajes

general:
  no_permission: "&cNo tenés permiso para usar este comando."

# Prompts genéricos del sistema de captura de chat (ChatPromptManager)
prompt:
  instructions: "&7Escribí en el chat, o 'cancelar' para abortar."
  cancelled: "&cCancelado."

# Comando /itemadmin
command:
  itemadmin:
    usage: "&cUso: /itemadmin <give|list|reload|create|browser|editor> [args]"
    player_only: "&cSolo un jugador puede usar esto."
    reload:
      success: "&a✔ Recargado: {count} ítem(s)."
    create:
      player_only: "&cSolo un jugador puede crear un ítem."
      usage: "&cUso: /itemadmin create <id> [pack] (si omitís [pack], elegís/creás uno desde un menú)"
      already_exists: "&cYa existe un ítem con ese id."
      success: "&a✔ Ítem '{id}' creado — configuralo en el editor."
    give:
      usage: "&cUso: /itemadmin give <jugador> <id> [cantidad]"
      player_not_found: "&cJugador no encontrado: {player}"
      item_not_found: "&cNo existe un ítem con id: {id}"
      invalid_amount: "&cLa cantidad debe ser un número válido."
      amount_range: "&cLa cantidad debe estar entre 1 y {max}."
      success: "&a✔ {amount}x '{id}' entregado a {player}{overflow}"
      overflow_suffix: " (inventario lleno — el sobrante cayó al piso)"
    list:
      empty: "&7No hay ítems definidos."
      header: "&6Ítems disponibles:"
      entry: "&f• {id} ({pack}, {rarity})"
    editor:
      usage: "&cUso: /itemadmin editor <id>"
      not_found: "&cNo existe un ítem con id: {id}"
  item:
    player_only: "Solo un jugador puede usar este comando."
    usage: "&cUso: /item <info|upgrade|skin|socket> [args]"
    no_item: "&cNo tenés un ítem de RPGRoll-Items en la mano."
    info:
      pack: "&7Pack: {pack}"
      rarity: "&7Rareza: {rarity}"
      upgrade_level: "&7Nivel de mejora: {level}"
      durability: "&7Durabilidad: {current}/{max}"
    upgrade:
      ok: "&a✔ Ítem mejorado."
      max_level: "&cEste ítem ya está en su nivel máximo."
      no_upgrade_defined: "&cEl próximo nivel de mejora no está definido todavía."
      cant_afford_money: "&cNo tenés suficiente dinero para esta mejora."
      missing_material: "&cTe falta el material requerido para esta mejora."
    skin:
      none: "&cEste ítem no tiene skins alternativas."
      changed: "&a✔ Skin cambiada a: {skin}"
      base: "apariencia base"
    socket:
      none: "&cEste ítem no tiene sockets."
      usage: "&cUso: /item socket <id> (con la gema en tu mano secundaria)"
      ok: "&a✔ Gema insertada."
      not_found: "&cEse ítem no tiene un socket con id: {id}"
      already_filled: "&cEse socket ya tiene una gema."
      type_not_accepted: "&cEse socket no acepta este tipo de gema."
      gem_not_found: "&cNecesitás tener una gema válida en tu mano secundaria."

# Lore/chrome generado por ItemFactory para cualquier ítem RPGRoll
item:
  durability_lore: "&7Durabilidad: {current}/{max}"
  socket_empty: "&8[Socket vacío]"
  socket_filled: "&b[Gema: {gem}]"

# ItemStack físico de una gema (GemItem)
gem:
  lore_type: "&7Gema: {type}"
  lore_instructions: "&8Click derecho en un socket para insertar."

# ItemEquipTask: aviso de requisitos incumplidos al equipar
equip:
  requirements_header: "&cNo cumplís los requisitos de {item}:"
  requirement_line: "&c- {reason}"

# ItemRequirementChecker: motivos individuales (se muestran vía equip.requirement_line)
requirement:
  level: "Necesitás nivel {level} (tenés {current})."
  race: "Necesitás ser de la raza: {race}"
  class: "Necesitás ser de la clase: {class}"
  profession: "Necesitás la profesión: {profession}"
  trait: "Necesitás el trait: {trait}"
  skill: "Necesitás la habilidad: {skill}"
  permission: "No tenés el permiso requerido."
  money: "Necesitás al menos {amount} de dinero."

# Cooldown de habilidad activa (ItemTriggerListener)
ability:
  cooldown: "&c{ability} en cooldown ({seconds}s)."

# DurabilityService
durability:
  broken: "&cTu {item} se rompió."

# GUIs de navegación (fuera del editor)
gui:
  browser:
    title: "&6Ítems RPGRoll"
    prev: "&e« Anterior"
    next: "&eSiguiente »"
    search_label: "&bBuscar"
    no_filter: "&7(sin filtro)"
    filter: "&7Filtro: {text}"
    all_categories: "&bTodas las categorías"
    clear_search: "&cLimpiar búsqueda"
    create_new: "&aCrear ítem nuevo"
    received: "&a✔ Recibiste: {item}"
    prompt_search: "Escribí parte del nombre o id del ítem:"
    prompt_new_item: "Escribí el id del nuevo ítem (ej. flame_blade):"
    invalid_id: "&cId inválido o ya existente."
  rarity_picker:
    title: "&6Elegí una rareza"
    id_lore: "&7id: {id}"
    glow_yes: "&7Brillo: sí"
    glow_no: "&7Brillo: no"
  material_picker:
    title: "&6Elegí un material"
    prev: "&e« Anterior"
    next: "&eSiguiente »"
    search: "&bBuscar"
    no_filter: "&7(sin filtro)"
    filter: "&7Filtro: {text}"
    clear_filter: "&cLimpiar filtro"
    prompt_search: "Escribí parte del nombre del material (ej. sword):"

