# ============================================================================
# ITEM DE REFERENCIA — usa TODOS los campos que soporta RPGRoll-Items.
# No está pensado para dar in-game tal cual (es intencionalmente muy fuerte):
# es documentación ejecutable. Copiá solo las secciones que necesites para tu
# propio ítem y borrá el resto — nada es obligatorio salvo "id" y "material".
# Ver la referencia completa en la documentación (página "Ítems").
# ============================================================================

id: reference_full_example
category: example
material: NETHERITE_SWORD

# Nombre visible (soporta color legacy &, hex &#RRGGBB, hex &x&R&R... y MiniMessage/gradientes)
display-name: "<gradient:#54daf4:#545eb6>Hoja de Referencia</gradient>"
lore:
  - "&7Un ítem de ejemplo que documenta cada campo disponible."
  - "&7No está pensado para usarse en partidas reales."

# CustomModelData para texture packs (opcional, requiere SackResourcePack u otro resource pack)
custom-model-data: 100001

# Rareza (debe existir un archivo en rarities/, ver esa carpeta)
rarity: MYTHIC

# true = brillo de encantamiento forzado sin encantar de verdad; false = sin brillo aunque tenga encantamientos; se omite = brillo automático según encantamientos reales
glow: true

# Flags vanilla de ItemFlag (oculta tooltips de Minecraft) — HIDE_ATTRIBUTES es un atajo aparte (ver "hide-attributes" abajo)
flags:
  - HIDE_ENCHANTS
  - HIDE_UNBREAKABLE
  - HIDE_DYE
  - HIDE_ARMOR_TRIM

# Atajo equivalente a agregar el flag HIDE_ATTRIBUTES a la lista de arriba
hide-attributes: false

# true = no se gasta ni por vanilla ni por el sistema de "durability" propio
unbreakable: false

# Color de tinte, solo aplica a cuero (LEATHER_*) — nombre de DyeColor o "#RRGGBB"
color: "#8B0000"

# Textura de cabeza (solo si material es PLAYER_HEAD) — nombre de jugador o valor base64 de textura
skull-texture: "MHF_Steve"

# Trim de armadura (solo aplica a piezas de armadura con soporte de trim, ej. NETHERITE_CHESTPLATE)
trim:
  material: REDSTONE
  pattern: SPIRE

# Stats propios de RPGRoll (no atributos vanilla) — cualquier clave es válida, el motor de combate/UI reconoce las conocidas (damage, critical_chance, critical_damage, magic_power, magic_resistance, luck, etc.)
stats:
  damage: 25
  critical_chance: 35
  critical_damage: 120
  magic_power: 15
  luck: 10

# Atributos vanilla de Minecraft (AttributeModifier reales, afectan al jugador como un ítem vanilla con atributos) — clave = nombre de Attribute (ej. GENERIC_ATTACK_DAMAGE, GENERIC_MAX_HEALTH, GENERIC_MOVEMENT_SPEED, GENERIC_ARMOR)
attributes:
  GENERIC_MAX_HEALTH: 4
  GENERIC_MOVEMENT_SPEED: 0.02

# Requisitos para poder usar/equipar el ítem — todos opcionales, se evalúan todos los presentes
requirements:
  level: 40
  race: elf
  class: warrior
  profession: blacksmith
  skill: swordsmanship
  trait: strong_arm
  permission: rpgroll.items.mythic
  money: 500
  completed-quests:
    - dragon_hunt
    - ancient_trial

# Durabilidad propia de RPGRoll (independiente de la durabilidad vanilla del material)
durability:
  max: 1000
  repairable: true
  degrade-per-use: 1
  auto-repair-per-minute: 0

# Encantamientos vanilla de Minecraft aplicados directamente al ítem — clave = nombre de Enchantment
enchantments:
  SHARPNESS: 5
  UNBREAKING: 3

# Encantamientos personalizados de RPGRoll-Enchantments (por id, no por nombre vanilla)
custom-enchantments:
  flaming_strike: 3

# Efectos de poción pasivos mientras el ítem está equipado/en mano
effects:
  - potion: FIRE_RESISTANCE
    amplifier: 0
    requires-held: true
  - potion: STRENGTH
    amplifier: 1
    requires-held: false

# Triggers -> lista de acciones. El trigger es el evento (EQUIP, UNEQUIP, RIGHT_CLICK,
# LEFT_CLICK, ENTITY_HIT, ENTITY_KILL, BLOCK_BREAK, BLOCK_PLACE, PLAYER_DAMAGE,
# PLAYER_DEATH, PLAYER_RESPAWN, PLAYER_MOVE, PLAYER_JUMP, PLAYER_SNEAK,
# PLAYER_SPRINT, PLAYER_INTERACT, CONSUME, THROW, PICKUP, DROP)
triggers:
  ENTITY_KILL:
    - type: MESSAGE
      value: "&4¡Otro enemigo cae ante la Hoja de Referencia!"
    - type: PARTICLE
      particle: DRAGON_BREATH
      count: 15
  EQUIP:
    - MESSAGE_EQUIPPED # una acción también puede ser un string simple sin parámetros

# Habilidades activables/pasivas del ítem
abilities:
  - id: reference_dash
    display-name: "&bEmbestida"
    passive: false
    trigger: RIGHT_CLICK
    cooldown: "10s"
    conditions:
      - "sneaking"
    actions:
      - type: PARTICLE
        particle: CLOUD
        count: 20
      - type: MESSAGE
        value: "&b¡Embestida activada!"
  - id: reference_passive_aura
    display-name: "&5Aura Pasiva"
    passive: true
    actions:
      - type: PARTICLE
        particle: PORTAL
        count: 5

# Sockets para engarzar gemas (ver gems/) — accepted-types filtra qué tipo de gema entra en cada socket
sockets:
  - id: socket_1
    accepted-types:
      - OFFENSIVE
      - UTILITY
  - id: socket_2
    accepted-types:
      - DEFENSIVE

# Skins alternativos: cambian material y/o custom-model-data visualmente sin cambiar stats
skins:
  - id: golden_finish
    display-name: "&6Hoja de Referencia (Acabado Dorado)"
    material: NETHERITE_SWORD
    custom-model-data: 100002
  - id: shadow_finish
    display-name: "&8Hoja de Referencia (Acabado Sombrío)"
    material: NETHERITE_SWORD
    custom-model-data: 100003

# Niveles de mejora (upgrade) — clave = número de nivel, cada uno suma stats y puede tener costo
upgrades:
  "1":
    stats:
      damage: 5
    cost: 100
    cost-material: DIAMOND
    cost-amount: 2
  "2":
    stats:
      damage: 10
      critical_chance: 5
    display-name: "<gradient:#54daf4:#545eb6>Hoja de Referencia +2</gradient>"
    rarity: DIVINE
    cost: 500
    cost-material: NETHERITE_INGOT
    cost-amount: 1

# Recetas de crafteo — type: SHAPED | SHAPELESS | FURNACE | SMITHING | STONECUTTER | NPC | PROFESSION | QUEST
# (las últimas 3 solo registran el dato; el addon correspondiente decide cuándo se "cumplen")
recipes:
  - type: SHAPED
    shape:
      - " D "
      - " D "
      - " S "
    key:
      D: DIAMOND
      S: STICK
  - type: SHAPELESS
    ingredients:
      - NETHERITE_INGOT
      - DIAMOND
      - DIAMOND
  - type: FURNACE
    base-material: IRON_SWORD
    cooking-time: 200
  - type: SMITHING
    base-material: DIAMOND_SWORD
  - type: NPC
    source: blacksmith_npc_recipe
  - type: PROFESSION
    source: blacksmith_master_recipe
  - type: QUEST
    source: dragon_hunt_reward_recipe

# Precio de compra/venta (requiere Vault)
economy:
  sell: 5000
  buy: 15000

# Datos libres clave-valor, para que otros addons (o placeholders) lean metadata propia
custom-data:
  faction: "reference_order"
  origin: "documentation"
