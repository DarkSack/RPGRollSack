# Pescadora de RPGRoll-Machines: con agua alrededor, pesca sola y lo deja en el cofre de al lado.

enabled: true
disabled-worlds: []

# Bloque que se pone (sólido y que no sea un contenedor). Con el paquete de recursos de Sackito,
# item-model y frame le ponen su modelo 3D; de fábrica se ve el bloque tal cual.
block: PRISMARINE_BRICKS
item-model: ""
frame:
  enabled: false
  model: ""
  scale: 1.002

# Prefijo de los menús dibujados del paquete de recursos (por ejemplo "sackito:menus"). Vacío: menús
# de siempre, con cristales y materiales vanilla.
menu:
  pack: ""

# Cuántas puede tener cada jugador (-1 sin tope). Es aparte del de las canteras y de las otras máquinas.
max-per-player: 2

# Solo trabaja si su área está entera dentro de un claim de su dueño (GriefPrevention).
require-claim: true

performance:
  # Acciones por tick entre todas las máquinas de este tipo.
  actions-per-tick: 8
  # Casillas del área que revisa cada máquina por tick.
  scans-per-tick: 1

# Fuentes de agua que necesita en el 5×5 de su altura y el de debajo.
min-water: 8

# Con RPGRoll-Fishing instalado, esta parte de las capturas son sus peces (según el agua donde está),
# con la calidad como mucho max-quality (0 común, 1 buena, 2 excelente, 3 perfecta, 4 obra maestra).
rpgroll-fishing:
  chance: 0.25
  max-quality: 2

# Pesca vanilla: MATERIAL:peso. Basura 10 % y tesoro 5 %, ajustados por la suerte como en vanilla.
# BOOK, BOW y FISHING_ROD salen encantados.
loot:
  fish: ["COD:60", "SALMON:25", "TROPICAL_FISH:2", "PUFFERFISH:13"]
  junk: ["LILY_PAD:17", "BOWL:10", "LEATHER:10", "LEATHER_BOOTS:10", "ROTTEN_FLESH:10", "STICK:5", "STRING:5",
    "BONE:10", "INK_SAC:1", "TRIPWIRE_HOOK:10"]
  treasure: ["BOW:1", "BOOK:1", "FISHING_ROD:1", "NAME_TAG:1", "NAUTILUS_SHELL:1", "SADDLE:1"]

upgrades:
  speed:
    icon: SUGAR
    levels:
      - {value: 0.1}
      - {value: 0.2, cost: {items: ["PRISMARINE_SHARD:32"]}}
      - {value: 0.35, cost: {items: ["DIAMOND:8"]}}
      - {value: 0.5, cost: {items: ["NETHERITE_INGOT:1"]}}
  luck:
    icon: HEART_OF_THE_SEA
    levels:
      - {value: 0}
      - {value: 1, cost: {items: ["LAPIS_BLOCK:8"]}}
      - {value: 2, cost: {items: ["LAPIS_BLOCK:16", "DIAMOND:4"]}}
      - {value: 3, cost: {items: ["DIAMOND_BLOCK:4"]}}
  rods:
    icon: FISHING_ROD
    levels:
      - {value: 1}
      - {value: 2, cost: {items: ["FISHING_ROD:4", "IRON_BLOCK:4"]}}
      - {value: 3, cost: {items: ["DIAMOND:8"]}}
      - {value: 4, cost: {items: ["NETHERITE_INGOT:1"]}}

recipe:
  enabled: true
  shape: ["IFI", "RPR", "IOI"]
  ingredients:
    I: IRON_BLOCK
    F: FISHING_ROD
    R: REDSTONE_BLOCK
    P: PRISMARINE_BRICKS
    O: OBSERVER
