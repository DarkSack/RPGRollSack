# ============================================================================
# EFECTO DE REFERENCIA — usa los 6 tipos de paso, las 8 formas de partícula y
# los 4 targets que soporta RPGRoll-FX. Documentación ejecutable, pensada
# para copiar/pegar pasos sueltos. Ver "RPGRoll-FX" en la docs.
# ============================================================================

id: reference_full_example
display-name: "&d&lEfecto de Referencia"
icon: BOOK
description: "Un efecto de ejemplo que documenta cada tipo de paso, forma y target disponible."

steps:
  # PARTICLE — shape: POINT (default, sin especificar)
  - type: PARTICLE
    delay: 0
    particle: END_ROD
    target: SELF
    count: 1
    speed: 0

  # PARTICLE — shape: CIRCLE
  - type: PARTICLE
    delay: 2
    particle: SNOWFLAKE
    shape: CIRCLE
    target: SELF
    radius: 1.5
    points: 30
    count: 1
    speed: 0

  # PARTICLE — shape: SPHERE
  - type: PARTICLE
    delay: 4
    particle: TOTEM_OF_UNDYING
    shape: SPHERE
    target: SELF
    radius: 1.2
    points: 60
    count: 1
    speed: 0

  # PARTICLE — shape: LINE (única forma que usa un segundo punto: "target" = from, "to" = destino)
  - type: PARTICLE
    delay: 6
    particle: FLAME
    shape: LINE
    target: SELF
    to: TARGET
    points: 20
    count: 1
    speed: 0

  # PARTICLE — shape: HELIX
  - type: PARTICLE
    delay: 8
    particle: PORTAL
    shape: HELIX
    target: SELF
    radius: 1.0
    height: 3.0
    turns: 3
    points: 60
    count: 1
    speed: 0

  # PARTICLE — shape: CONE (según hacia dónde mira el jugador)
  - type: PARTICLE
    delay: 10
    particle: FLAME
    shape: CONE
    target: SELF
    radius: 1.5
    length: 3.0
    points: 40
    count: 1
    speed: 0

  # PARTICLE — shape: CUBE_OUTLINE
  - type: PARTICLE
    delay: 12
    particle: SOUL_FIRE_FLAME
    shape: CUBE_OUTLINE
    target: SELF
    radius: 1.0
    points: 40
    count: 1
    speed: 0

  # PARTICLE — shape: BURST
  - type: PARTICLE
    delay: 14
    particle: FIREWORK
    shape: BURST
    target: SELF
    radius: 1.5
    points: 40
    count: 1
    speed: 0.3

  # SOUND — target: SELF (solo el caster lo escucha)
  - type: SOUND
    delay: 0
    sound: BLOCK_BEACON_ACTIVATE
    target: SELF
    volume: 1.0
    pitch: 1.0

  # SOUND — target: ALL_NEARBY (todos dentro de radius alrededor de "around")
  - type: SOUND
    delay: 14
    sound: ENTITY_ENDER_DRAGON_GROWL
    target: ALL_NEARBY
    around: SELF
    radius: 10
    volume: 1.0
    pitch: 0.8

  # TITLE
  - type: TITLE
    delay: 2
    title: "&d&l¡Efecto de Referencia!"
    subtitle: "&7Documentación ejecutable"
    target: SELF
    fade-in: 5
    stay: 40
    fade-out: 10

  # ACTIONBAR
  - type: ACTIONBAR
    delay: 0
    text: "&d✦ Efecto de Referencia activado ✦"
    target: SELF

  # BOSSBAR — target: ALL_NEARBY
  - type: BOSSBAR
    delay: 0
    title: "&d✦ Efecto de Referencia ✦"
    color: PURPLE
    style: SEGMENTED_10
    duration: 60
    target: ALL_NEARBY
    around: SELF
    radius: 8

  # POTION — target: TARGET (si el contexto tiene un objetivo; si no, cae a SELF)
  - type: POTION
    delay: 4
    potion: GLOWING
    duration: 100
    amplifier: 0
    target: TARGET

  # ==========================================================================
  # FORMAS NUEVAS — VORTEX, DOME, SPIRAL, PILLAR
  # ==========================================================================

  # VORTEX: varias hélices entrelazadas que se cierran al subir (radius → radius-top).
  - type: PARTICLE
    delay: 16
    particle: WITCH
    shape: VORTEX
    target: SELF
    radius: 2.0
    radius-top: 0.3
    height: 3.0
    strands: 3
    turns: 1.5
    points: 90

  # DOME: media esfera apoyada en el suelo.
  - type: PARTICLE
    delay: 18
    particle: END_ROD
    shape: DOME
    target: SELF
    radius: 2.0
    points: 60

  # SPIRAL: espiral plana con uno o varios brazos.
  - type: PARTICLE
    delay: 20
    particle: ENCHANT
    shape: SPIRAL
    target: SELF
    radius: 3.0
    turns: 1.5
    strands: 3
    points: 90

  # PILLAR: anillos apilados, un haz de luz.
  - type: PARTICLE
    delay: 22
    particle: GLOW
    shape: PILLAR
    target: SELF
    radius: 0.8
    height: 4.0
    rings: 8
    points: 80

  # ==========================================================================
  # COLOR, ANIMACIÓN Y MOVIMIENTO (valen para cualquier PARTICLE)
  # ==========================================================================
  #   color:        "#FF8800" | "255,136,0" | GOLD | "#FF0000,#FFFF00" (degradado) | RAINBOW
  #   color-to:     color final (degradado en DUST; color al que se apaga en DUST_COLOR_TRANSITION)
  #   size:         tamaño del polvo, 0.01 a 4
  #   block / item: material para BLOCK, FALLING_DUST, DUST_PILLAR, ITEM...
  #   power:        para las partículas que piden un número (DRAGON_BREATH)
  #   y-offset:     sube o baja la figura entera; con y-offset-to cambia en cada repetición
  #   repeat / interval: repite el paso N veces cada X ticks (también SOUND y el resto)
  #   radius-to:    radio en la última repetición: un anillo que se expande
  #   rotation / rotate: giro inicial y grados extra por repetición (figuras que giran)
  #   motion:       OUTWARD | INWARD | UP | DOWN, con motion-speed (ondas, implosiones)
  #   force:        true para que se vea desde lejos (úsalo con moderación)
  # Y en SOUND: pitch-to, el tono de la última repetición (una carga que sube).

  # Anillo arcoíris que se expande y gira.
  - type: PARTICLE
    delay: 24
    particle: DUST
    color: RAINBOW
    size: 1.5
    shape: CIRCLE
    target: SELF
    y-offset: 0.1
    radius: 0.5
    radius-to: 5.0
    rotate: 10
    points: 80
    repeat: 10
    interval: 1

  # Chispas disparadas hacia fuera.
  - type: PARTICLE
    delay: 24
    particle: ELECTRIC_SPARK
    shape: SPHERE
    target: SELF
    y-offset: 1.0
    radius: 0.5
    points: 60
    motion: OUTWARD
    motion-speed: 0.5

  # ==========================================================================
  # PASOS NUEVOS — FIREWORK y LIGHTNING
  # ==========================================================================

  # FIREWORK: cohete que explota al instante, sin hacer daño.
  # shape: BALL | BALL_LARGE | STAR | BURST | CREEPER
  - type: FIREWORK
    delay: 26
    target: SELF
    y-offset: 2.5
    shape: STAR
    colors: "#FF6BF2,#FFFFFF"
    fade: "#7B2CFF"
    flicker: true
    trail: true
    count: 2
    spread: 1.0

  # LIGHTNING: rayo solo visual (sin fuego ni daño).
  - type: LIGHTNING
    delay: 28
    target: SELF
