id: fire_burst
display-name: "&6Estallido de Fuego"
icon: FIRE_CHARGE
description: "Una bola de fuego que revienta: destello, llamas disparadas en todas direcciones, un anillo de brasas que se abre por el suelo y humo. Pensado para el impacto de un proyectil."

steps:
  - type: SOUND
    delay: 0
    sound: ENTITY_GENERIC_EXPLODE
    target: LOCATION
    volume: 1.0
    pitch: 1.3

  - type: SOUND
    delay: 0
    sound: ITEM_FIRECHARGE_USE
    target: LOCATION
    volume: 1.0
    pitch: 0.8

  - type: PARTICLE
    delay: 0
    particle: EXPLOSION
    target: TARGET

  # Llamas disparadas hacia fuera desde el punto de impacto.
  - type: PARTICLE
    delay: 0
    particle: FLAME
    shape: SPHERE
    target: TARGET
    radius: 0.4
    points: 60
    motion: OUTWARD
    motion-speed: 0.3
    force: true

  - type: PARTICLE
    delay: 0
    particle: DUST
    color: "#FFE08A,#FF6A00,#C21E00"
    size: 1.8
    shape: SPHERE
    target: TARGET
    radius: 0.5
    radius-to: 1.8
    points: 40
    repeat: 4
    interval: 1
    force: true

  # Anillo de brasas que se abre.
  - type: PARTICLE
    delay: 0
    particle: DUST_COLOR_TRANSITION
    color: "#FFB040"
    color-to: "#3A1000"
    size: 1.5
    shape: CIRCLE
    target: TARGET
    radius: 0.4
    radius-to: 3.0
    points: 50
    repeat: 6
    interval: 1

  - type: PARTICLE
    delay: 0
    particle: LAVA
    target: TARGET
    count: 6

  - type: PARTICLE
    delay: 3
    particle: LARGE_SMOKE
    target: TARGET
    count: 12
    offset-x: 0.4
    offset-y: 0.3
    offset-z: 0.4
    speed: 0.03
