# Idioma de los mensajes (jugador y comandos). Opciones: es, en, pt_BR.
# Los textos viven en lang/<idioma>.yml dentro de esta carpeta de datos —
# puedes editarlos ahí directamente. Tras cambiar esto, /guildadmin reload.
language: es

# Territorios (/guild, Territorio). El radio es la mitad del lado del cubo
# que se protege alrededor de quien reclama; sin tope, una guild podía
# reclamar el mapa entero.
territories:
  min-radius: 5
  max-radius: 50
  # Mundos donde se puede reclamar (vacío = todos).
  worlds: []

guild-creation:
  money-cost: 5000
  min-level: 5
  required-permission: ""
  required-quest: ""        # id de una misión de RPGRoll-Quests (sin ese plugin no se exige)
  required-item: ""
  required-item-amount: 0
