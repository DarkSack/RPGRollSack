name: RPGRoll-Magic
version: 1.0.0
main: com.sack.rpgroll.magic.MagicPlugin
api-version: "26.1.1"
author: Sack
description: Framework de magia modular — escuelas, hechizos construidos por componentes, maná, catalizadores, grimorios, runas y árboles de progresión.
depend: [RPGRoll]
softdepend: [RPGRoll-FX, RPGRoll-Effects]

permissions:
  rpgrollmagic.admin.*:
    description: Acceso completo a comandos administrativos de Magic Studio
    default: op
  rpgrollmagic.use:
    description: Uso básico del sistema de magia (spellbook, seleccionar, lanzar)
    default: true
