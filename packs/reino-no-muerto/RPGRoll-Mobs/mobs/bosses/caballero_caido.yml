# Mini jefe de mitad de mazmorra. Una sola fase, para que se lea como
# un escalón antes del liche y no como otro jefe completo.
id: caballero_caido
category: MINI_BOSS
display-name: "&4Caballero Caído"
name-color: "#8B0000"
level: 22
rarity: epic
tags: [ "no_muerto", "reino_no_muerto", "jefe" ]
description: "Juró proteger la cripta. Sigue cumpliendo, siglos después de morir."
base-entity-type: WITHER_SKELETON

model:
