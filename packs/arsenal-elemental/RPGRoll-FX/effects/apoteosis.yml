id: apoteosis
display-name: "&6&lApoteosis"
description: "El más grande del pack: 9 capas encadenadas durante casi dos segundos, con título y bossbar."

steps:
  - type: TITLE
    delay: 0
    title: "&6&l✦ APOTEOSIS ✦"
    subtitle: "&7El aire se rinde"
    target: SELF
    fade-in: 3
    stay: 45
    fade-out: 12

  - type: BOSSBAR
    delay: 0
    title: "&6✦ Apoteosis ✦"
    color: YELLOW
    style: SEGMENTED_20
    duration: 80
    target: ALL_NEARBY
    around: SELF
    radius: 20

  - type: SOUND
    delay: 0
    sound: ENTITY_ENDER_DRAGON_GROWL
    target: ALL_NEARBY
    around: SELF
    radius: 30
    volume: 1.0
    pitch: 1.1

  # 1. Nucleo compacto
  - type: PARTICLE
    delay: 0
    particle: TOTEM_OF_UNDYING
    shape: SPHERE
    target: LOCATION
    radius: 2.0
    points: 200
    count: 8
    offset-x: 0.15
    offset-y: 0.15
    offset-z: 0.15
    speed: 0.02

  # 2. Columna que sube girando
  - type: PARTICLE
    delay: 4
    particle: END_ROD
    shape: HELIX
    draw-ticks: 12
    target: LOCATION
    radius: 2.2
    height: 6.0
    turns: 5
    points: 220
    count: 6
    offset-x: 0.12
    offset-y: 0.12
    offset-z: 0.12
    speed: 0

  # 3. Anillo bajo que se abre
  - type: PARTICLE
    delay: 8
    particle: FLAME
    shape: CIRCLE
    draw-ticks: 5
    target: LOCATION
    radius: 4.5
    points: 180
    count: 7
    offset-x: 0.2
    offset-y: 0.1
    offset-z: 0.2
    speed: 0.05

  # 4. Anillo alto, mas abierto
  - type: PARTICLE
    delay: 12
    particle: SOUL_FIRE_FLAME
    shape: CIRCLE
    draw-ticks: 5
    target: LOCATION
    radius: 6.5
    points: 200
    count: 7
    offset-x: 0.25
    offset-y: 0.25
    offset-z: 0.25
    speed: 0.06

  - type: SOUND
    delay: 12
    sound: BLOCK_BEACON_POWER_SELECT
    target: ALL_NEARBY
    around: SELF
    radius: 25
    volume: 1.2
    pitch: 0.8

  # 5. Cupula completa
  - type: PARTICLE
    delay: 16
    particle: ENCHANT
    shape: SPHERE
    target: LOCATION
    radius: 5.0
    points: 220
    count: 6
    offset-x: 0.2
    offset-y: 0.2
    offset-z: 0.2
    speed: 0.03

  # 6. El estallido final
  - type: PARTICLE
    delay: 22
    particle: FIREWORK
    shape: BURST
    target: LOCATION
    radius: 7.0
    points: 220
    count: 10
    offset-x: 0.3
    offset-y: 0.3
    offset-z: 0.3
    speed: 0.5

  - type: PARTICLE
    delay: 22
    particle: EXPLOSION_EMITTER
    shape: CIRCLE
    draw-ticks: 5
    target: LOCATION
    radius: 3.0
    points: 12
    count: 1
    speed: 0

  - type: SOUND
    delay: 22
    sound: ENTITY_FIREWORK_ROCKET_LARGE_BLAST
    target: ALL_NEARBY
    around: SELF
    radius: 30
    volume: 1.3
    pitch: 1.0
