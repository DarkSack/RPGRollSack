  - slot: 16
    material: PAPER
    name: "&dSeñuelo de Coral"
    lore:
      - "&7Cebo para la pesca del arrecife."
      - "&7Precio: &a2 esmeraldas"
    actions:
      - type: CONDITIONAL
        value: "HAS_ITEM:EMERALD,2;COMMAND:fishingadmin givebait mareas_senuelo_de_coral {player};MESSAGE:Necesitas 2 esmeraldas."
