      - type: CONDITIONAL
        value: "HAS_ITEM:EMERALD,4;COMMAND:itemadmin give {player} mareas_tonico_salobre 1;MESSAGE:Necesitas 4 esmeraldas."
      - type: CONDITIONAL
        value: "HAS_ITEM:EMERALD,4;TAKE_ITEM:EMERALD,4"
  - slot: 13
