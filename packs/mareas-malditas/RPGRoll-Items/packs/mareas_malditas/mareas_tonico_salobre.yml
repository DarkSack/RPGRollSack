      - "&7Water breathing and night vision for 3 min."
      - "&8Drink it to use it."
  pt_BR:
    display-name: "&bTônico Salobre"
    lore:
      - "&7Água do mar, tinta de lula e algo"
      - "&7que se mexe no fundo da garrafa."
