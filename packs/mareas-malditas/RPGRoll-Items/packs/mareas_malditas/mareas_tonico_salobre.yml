# Para bajar a la Gruta del Naufragio: respirar y ver bajo el agua.
id: mareas_tonico_salobre
pack: mareas_malditas
material: HONEY_BOTTLE
item-model: "mareas:consumible/tonico_salobre"
display-name: "&bTónico Salobre"
lore:
  - "&7Agua de mar, tinta de calamar y algo"
  - "&7que se mueve en el fondo de la botella."
  - "&7Respiración acuática y visión nocturna 3 min."
