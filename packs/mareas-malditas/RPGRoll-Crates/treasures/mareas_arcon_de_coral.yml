# Tesoro de arrecife: más profundo y mejor. Puede caer bajo el agua (fondo
# con 6 bloques o menos de agua encima). Sale de sirenas, del Kraken, de la
# historia, del rango de Buzo, de la mazmorra, de la caja y de la Cartógrafa.
id: mareas_arcon_de_coral
display-name: "&3Arcón de Coral"

map:
  material: PAPER
  model: "mareas:mapa/carta_de_coral"
  name: "&3Carta de Coral"
  lore:
    - "&7Dibujada con tinta de calamar sobre piel de raya."
    - "&7La X está bajo el agua."
    - "&8Clic derecho para leerla."

placement:
  worlds: []
  biomes: [warm_ocean, lukewarm_ocean, beach]
  min-distance: 250
  max-distance: 900
  depth: 4

chest:
  model: "mareas:mareas_arcon_de_coral/default"
  scale: 1.0
  rows: 4
  title: "&3Arcón de Coral"
  guardians:
    - {type: COMMAND, command: "mobadmin spawn mareas_sirena {player}"}
    - {type: COMMAND, command: "mobadmin spawn mareas_anguila {player}"}
    - {type: SOUND, sound: block.amethyst_block.resonate, volume: 1.0, pitch: 1.4}
    - {type: MESSAGE, text: "&dAlguien empieza a cantar muy cerca."}

loot:
  rolls: 5-8
  entries:
    - {item: mareas_doblon_de_oro, amount: 6-14, weight: 12}
    - {item: mareas_perla_negra, amount: 1-3, weight: 8}
    - {item: mareas_coral_maldito, amount: 4-10, weight: 8}
    - {item: DIAMOND, amount: 1-4, weight: 5}
    - {item: HEART_OF_THE_SEA, weight: 2}
    - {item: mareas_tonico_salobre, amount: 1-3, weight: 5}
    - {item: mareas_ancla_de_guerra, weight: 1}
    - {item: mareas_brujula_maldita, weight: 1}

actions:
  - {type: XP, amount: 150}
  - {type: MONEY, amount: 400-800}
  - {type: TITLE, title: "&3&lARCÓN DE CORAL", subtitle: "&7Lo que el arrecife guardaba"}
