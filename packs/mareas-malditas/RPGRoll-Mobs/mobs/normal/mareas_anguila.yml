# Enemigo de mar profundo: rápida, con una descarga que deja temblando.
# Modelo 3D: FreeMinecraftModels/models/mareas_anguila.bbmodel. Sin FMM se ve un guardián.
id: mareas_anguila
category: NORMAL
display-name: "&eAnguila Voltaica"
name-color: "#F4D35E"
level: 20
rarity: uncommon
tags: [ "mareas_malditas", "bestia", "modelo3d" ]
description: "Brilla un segundo antes de soltar la descarga. Ese segundo es todo el aviso."
base-entity-type: GUARDIAN

model:
  scale: 1.0
  model-engine-id: mareas_anguila
  equipment:

stats:
  health: 60
  damage: 7
  defense: 3
  speed: 115
  armor: 2
  dodge: 10
  accuracy: 90
  critical_chance: 6
  critical_damage: 30
  knockback_resistance: 0

resistances:
  magic: 15

ai:
  goals: [ "ATTACK_PLAYERS" ]
