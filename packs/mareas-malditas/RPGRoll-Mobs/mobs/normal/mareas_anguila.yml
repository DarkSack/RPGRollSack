    actions:
      - type: ANIMATION
        value: descarga
      - type: PARTICLE
        particle: ELECTRIC_SPARK
        count: "40"
        offset-x: "1.5"
        offset-y: "0.8"
        offset-z: "1.5"
      - type: DAMAGE
        amount: "8"
      - type: COMMAND
        value: "minecraft:effect give {target} minecraft:mining_fatigue 4 0"
      - type: SOUND
        sound: ENTITY_GUARDIAN_ATTACK
        volume: "1.0"
        pitch: "1.8"

loot:
