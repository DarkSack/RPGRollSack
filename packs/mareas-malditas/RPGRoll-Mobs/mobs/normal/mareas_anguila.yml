    reference: mareas_coral_maldito
    amount-min: 1
    amount-max: 2
    chance: 45
    scope: PER_PLAYER
  - type: ITEM
    reference: PRISMARINE_CRYSTALS
    amount-min: 1
    amount-max: 3
    chance: 35
    scope: PER_PLAYER
  - type: EXPERIENCE
    amount-min: 16
    amount-max: 24
    chance: 100
    scope: PER_PLAYER

spawn-rules:
  biomes: [DEEP_OCEAN, DEEP_COLD_OCEAN, DEEP_LUKEWARM_OCEAN]
