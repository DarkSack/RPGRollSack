    params:
      particle: ITEM_SNOWBALL
      count: "30"
      offset-x: "0.8"
      offset-y: "0.3"
      offset-z: "0.8"
      speed: "0.05"
  - type: DAMAGE
    params:
      amount: "3"

cooldown-millis: 6000
charges: -1
chain: []

disguise:
  mode: BLOCK_SWAP
  visible-material: SAND
  revealed-material: COBWEB
