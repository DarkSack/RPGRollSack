id: yermo_hongo_atomico
display-name: "&6&lHongo Atómico"
description: "Destello, columna de humo y la copa de la seta."

steps:
  - type: PARTICLE
    delay: 0
    particle: END_ROD
    shape: BURST
    target: LOCATION
    radius: 2.0
    points: 40
    count: 1
    speed: 0.5
  - type: PARTICLE
    delay: 0
    particle: FLAME
    shape: BURST
    target: LOCATION
    radius: 3.0
    points: 90
    count: 2
    speed: 0.3
  - type: PARTICLE
    delay: 2
    particle: LARGE_SMOKE
    shape: PILLAR
    target: LOCATION
    radius: 0.9
    height: 5.0
    points: 70
    count: 2
    speed: 0.02
  - type: PARTICLE
    delay: 6
    particle: CAMPFIRE_COSY_SMOKE
    shape: DOME
    target: LOCATION
    y-offset: 5.0
    radius: 2.6
    points: 80
    count: 1
    speed: 0.01
  - type: PARTICLE
    delay: 6
    particle: DUST
    color: "#B5FF3A"
    size: 1.6
    shape: CIRCLE
    target: LOCATION
    y-offset: 0.2
    radius: 1.0
    radius-to: 6.0
    points: 60
    repeat: 6
    interval: 1
  - type: SOUND
    delay: 0
    sound: ENTITY_GENERIC_EXPLODE
    target: ALL_NEARBY
    around: SELF
    radius: 30
    volume: 1.4
    pitch: 0.5
