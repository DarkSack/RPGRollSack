# Idioma de los mensajes (jugador y comandos). Opciones: es, en, pt_BR.
# Los textos viven en lang/<idioma>.yml dentro de esta carpeta de datos —
# puedes editarlos ahí directamente. Tras cambiar esto, /fishingadmin reload.
language: es

# true = minijuego RPG (barra de tensión, hay que "reelear" en el momento justo o el pez escapa).
# false = modo vanilla (se resuelve la captura al instante, sin minijuego, como Minecraft normal).
rpg-mode: true

# Probabilidades globales de que una picada sea tesoro/basura en vez de un pez
# (se evalúan antes de sortear la especie — el resto de la probabilidad es "pez").
treasure-chance: 0.05
junk-chance: 0.10
