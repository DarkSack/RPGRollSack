# Mina de presión: al pisar el bloque exacto, explota y aplica un efecto de estado (si RPGRoll-Effects está instalado).
id: landmine
display-name: "&cMina Terrestre"
description: "Explota al pisarla."
icon: TNT

trigger:
  type: PRESSURE

radius: 0.5
conditions: []

actions:
  - type: SOUND
    params:
      sound: ENTITY_TNT_PRIMED
      volume: "1.4"
      pitch: "0.8"
  - type: EXPLOSION
    params:
      # 4.0 es la potencia de un TNT. Con 2.5 apenas se notaba.
      power: "4.0"
      fire: "false"
      # En true deja cráter de verdad. Ponlo en false si no quieres que la
      # mina te rompa el escenario.
      break-blocks: "true"
      knockback: "1.4"
  - type: EFFECT
    params:
      effect-id: "burning"

cooldown-millis: 10000
charges: 1
chain: []
