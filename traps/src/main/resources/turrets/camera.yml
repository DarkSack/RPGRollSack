# Cámara de seguridad: no dispara. Avisa a su dueño cuando ve a alguien que no es de los suyos
# y se puede mirar por ella con clic derecho, o desde lejos con un monitor (turrets/monitor.yml).
id: camera
display-name: "&bCámara de Seguridad"
description: "Te avisa de quien entra en lo que ve. Clic derecho, o un monitor, para mirar por ella."

# Hasta dónde ve. Solo avisa de lo que tiene a la vista: una pared lo tapa.
radius: 16.0
target-players: true
target-hostile-mobs: false
# Con una cámara, cada cuánto como mucho repite el aviso (600 ticks = 30 s).
fire-interval-ticks: 600

conditions: []

# CAMERA es lo que la hace cámara: avisa en vez de disparar y no lleva munición.
impact:
  type: CAMERA

model:
  # Un poste: la cámara va encima. Colócalo en alto para que vea más.
  base-block: POLISHED_DEEPSLATE_WALL
  material: SPYGLASS
  item-model: "rpgroll_traps:turret/camera"
  hover-height: 0.95
  # Barre despacio la zona; al ver a alguien lo sigue.
  spin-degrees-per-tick: 1.5
