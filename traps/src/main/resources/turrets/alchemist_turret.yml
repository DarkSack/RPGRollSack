# Torreta "alquimista": dispara pociones arrojadizas reales (ThrownPotion) en vez de una
# flecha — al estallar aplican efectos de poción vanilla (Lentitud + Debilidad) pero NO
# hacen daño de impacto (una poción arrojadiza vanilla nunca daña al pegar, solo por sus
# propios efectos — y ninguno de los dos elegidos aquí es dañino). Cambia "effects" por
# cualquier PotionEffectType vanilla (ej. POISON o WITHER si SÍ quieres que dañen con el tiempo).
id: alchemist_turret
display-name: "&dTorreta Alquimista"
description: "Lanza pociones que no dañan, pero ralentizan y debilitan al objetivo."

radius: 10.0
target-players: true
target-hostile-mobs: true
fire-interval-ticks: 60

conditions: []

impact:
  type: CUSTOM_PROJECTILE
  params:
    projectile-type: POTION
    # Lo que se ve volar (sin esta clave, el proyectil de Minecraft tal cual).
    model: "rpgroll_traps:projectile/flask"
    speed: "1.5"
    effects: "SLOWNESS:200:1;WEAKNESS:200:0"

model:
  # Bloque entero que se coloca en el mundo: es el cuerpo de la torreta.
  base-block: BREWING_STAND
  # Ítem que flota encima. Gira solo mientras busca y se orienta
  # hacia el objetivo cuando lo detecta.
  material: BLAZE_ROD
  # El modelo 3D de esa cabeza. Sin esta clave se ve el material de arriba.
  item-model: "rpgroll_traps:turret/alchemist_turret"
  hover-height: 0.95
  spin-degrees-per-tick: 4.0
