    item_lore_place: "&7Coloque onde quiser"
    item_lore_owner: "&8Só você poderá removê-la"
    usage: |-
      &eUso: /trapadmin turret
      &7 • &bcreate
      &7 • &aedit
      &7 • &ebrowser
      &7 • &dgive
      &7 • &6catalog
      &7 • &9place
      &7 • &cremove
      &7 • &flist
    not_found: "&cNão existe a torreta '{id}'."
    create:
      usage: "&eUso: /trapadmin turret create <id>"
      id_taken: "&cJá existe uma torreta com esse id."
      ok: "&a✔ Torreta '{id}' criada — edite com /trapadmin turret edit {id} (ou /trapadmin turret browser)."
    edit:
      usage: "&eUso: /trapadmin turret edit <id>"
    place:
      usage: "&eUso: /trapadmin turret place <id>"
      ok: "&a✔ Torreta '{turret}' colocada — id da instância: {placement}"
    remove:
      usage: "&eUso: /trapadmin turret remove <placementId>"
      ok: "&a✔ Torreta '{placement}' removida."
      not_found: "&cNão existe a torreta colocada '{placement}'."
    list:
      empty: "&7Ainda não há nenhuma torreta colocada."
      header: "&6=== Torretas colocadas ({count}) ==="
      entry: "&f• {placement} — tipo: {turret}"

