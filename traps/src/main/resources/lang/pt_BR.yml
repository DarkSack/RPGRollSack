# Mensagens de RPGRoll-Traps (idioma: Português do Brasil)
# Edite este arquivo livremente — suas mudanças sobrevivem a um /trapadmin reload.
# Placeholders com {chave} são substituídos por valores dinâmicos onde indicado.

general:
  no_permission: "&cVocê não tem permissão para usar este comando."
  player_only: "&cSó um jogador pode fazer isso."

prompt:
  footer: "&7Digite no chat, ou '{keyword}' para cancelar."
  cancel_keyword: "cancelar"
  cancelled: "&cCancelado."

admin:
  usage: |-
    &eUso: /trapadmin
    &7 • &bcreate
    &7 • &aedit
    &7 • &ebrowser
    &7 • &dreload
    &7 • &6place
    &7 • &9remove
    &7 • &clist
    &7 • &finfo
    &7 • &5forcetrigger
    &7 • &2turret
