# Mensagens de RPGRoll-Traps (idioma: Português do Brasil)
# Edite este arquivo livremente — suas mudanças sobrevivem a um /trapadmin reload.
# Placeholders com {chave} são substituídos por valores dinâmicos onde indicado.

general:
  no_permission: "&cVocê não tem permissão para usar este comando."
  player_only: "&cSó um jogador pode fazer isso."

prompt:
  footer: "&7Digite no chat, ou '{keyword}' para cancelar."
  cancel_keyword: "cancelar"
  cancelled: "&cCancelado."

admin:
  usage: "&eUso: /trapadmin <create|edit|browser|reload|place|remove|list|info|forcetrigger|turret> [args]"
  trap_not_found: "&cNão existe a armadilha '{id}'."
  must_look_at_block: "&cVocê precisa estar olhando para um bloco."
  create:
    usage: "&eUso: /trapadmin create <id>"
    id_taken: "&cJá existe uma armadilha com esse id."
    ok: "&a✔ Armadilha '{id}' criada — edite com /trapadmin edit {id} (ou /trapadmin browser)."
  edit:
    usage: "&eUso: /trapadmin edit <id>"
  reload:
    ok: "&a✔ Recarregado: {traps} armadilha(s), {locations} instância(s) colocada(s)."
  place:
    usage: "&eUso: /trapadmin place <id> [zone]"
    ok: "&a✔ Armadilha '{trap}' colocada — id da instância: {placement}"
  remove:
    usage: "&eUso: /trapadmin remove <placementId>"
    ok: "&a✔ Instância '{placement}' removida."
    not_found: "&cNão existe a instância '{placement}'."
  list:
    empty: "&7Ainda não há nenhuma armadilha colocada."
    header: "&6=== Armadilhas colocadas ({count}) ==="
    entry: "&f• {placement} — tipo: {trap} — estado: {state}"
  info:
    usage: "&eUso: /trapadmin info <placementId>"
    header: "&6=== Instância {placement} ({trap}) ==="
    state: "&7Estado: {state}"
    charges: "&7Cargas restantes: {value}"
    position: "&7Posição: {world} ({x}, {y}, {z})"
  forcetrigger:
    usage: "&eUso: /trapadmin forcetrigger <placementId>"
    ok: "&a✔ Instância '{placement}' disparada."
    failed: "&cNão foi possível disparar '{placement}' (não existe, não está ARMED, ou não cumpre condições)."
  turret:
    usage: "&eUso: /trapadmin turret <create|edit|browser|place|remove|list> [args]"
    not_found: "&cNão existe a torreta '{id}'."
    create:
      usage: "&eUso: /trapadmin turret create <id>"
      id_taken: "&cJá existe uma torreta com esse id."
      ok: "&a✔ Torreta '{id}' criada — edite com /trapadmin turret edit {id} (ou /trapadmin turret browser)."
    edit:
      usage: "&eUso: /trapadmin turret edit <id>"
    place:
      usage: "&eUso: /trapadmin turret place <id>"
      ok: "&a✔ Torreta '{turret}' colocada — id da instância: {placement}"
    remove:
      usage: "&eUso: /trapadmin turret remove <placementId>"
      ok: "&a✔ Torreta '{placement}' removida."
      not_found: "&cNão existe a torreta colocada '{placement}'."
    list:
      empty: "&7Ainda não há nenhuma torreta colocada."
      header: "&6=== Torretas colocadas ({count}) ==="
      entry: "&f• {placement} — tipo: {turret}"

