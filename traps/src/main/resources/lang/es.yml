# Mensajes de RPGRoll-Traps (idioma: Español)
# Edita este archivo libremente — tus cambios se conservan tras un /trapadmin reload.
# Placeholders con {llave} se reemplazan por valores dinámicos donde se indique.

general:
  no_permission: "&cNo tienes permiso para usar este comando."
  player_only: "&cSolo un jugador puede hacer esto."

prompt:
