# RPGRoll-Traps messages (language: English)
# Edit this file freely — your changes survive a /trapadmin reload.
# Placeholders like {key} get replaced with dynamic values where noted.

general:
  no_permission: "&cYou don't have permission to use this command."
  player_only: "&cOnly a player can do this."

prompt:
  footer: "&7Type in chat, or '{keyword}' to cancel."
  cancel_keyword: "cancel"
  cancelled: "&cCancelled."

admin:
  usage: |-
    &eUsage: /trapadmin
    &7 • &bcreate
    &7 • &aedit
    &7 • &ebrowser
    &7 • &dreload
    &7 • &6place
    &7 • &9remove
    &7 • &clist
    &7 • &finfo
    &7 • &5forcetrigger
    &7 • &2turret
    &7 • &bammo
  trap_not_found: "&cThere is no trap '{id}'."
  must_look_at_block: "&cYou need to be looking at a block."
  create:
    usage: "&eUsage: /trapadmin create <id>"
    id_taken: "&cA trap with that id already exists."
    ok: "&a✔ Trap '{id}' created — edit it with /trapadmin edit {id} (or /trapadmin browser)."
  edit:
    usage: "&eUsage: /trapadmin edit <id>"
  reload:
    ok: "&a✔ Reloaded: {traps} trap(s), {turrets} turret(s), {ammo} ammo type(s), {locations} placed instance(s)."
  place:
    usage: "&eUsage: /trapadmin place <id> [zone]"
    ok: "&a✔ Trap '{trap}' placed — instance id: {placement}"
  remove:
    usage: "&eUsage: /trapadmin remove <placementId>"
    ok: "&a✔ Instance '{placement}' removed."
    not_found: "&cThere is no instance '{placement}'."
  list:
    empty: "&7No trap has been placed yet."
    header: "&6=== Placed traps ({count}) ==="
    entry: "&f• {placement} — type: {trap} — state: {state}"
  info:
    usage: "&eUsage: /trapadmin info <placementId>"
    header: "&6=== Instance {placement} ({trap}) ==="
    state: "&7State: {state}"
    charges: "&7Charges remaining: {value}"
    position: "&7Position: {world} ({x}, {y}, {z})"
  forcetrigger:
    usage: "&eUsage: /trapadmin forcetrigger <placementId>"
    ok: "&a✔ Instance '{placement}' triggered."
    failed: "&cCouldn't trigger '{placement}' (doesn't exist, not ARMED, or conditions not met)."
  ammo:
    give_needs_player: "&cFrom console you must name the player: /trapadmin ammo give <id> <player>"
    item_lore: "&8Loads {amount} shot(s) per unit"
    give_usage: "&eUsage: /trapadmin ammo give <id> [player] [amount]"
    not_found: "&cNo ammunition exists with id '{id}'."
    given: "&a✔ {amount}x '{id}' given to {player}."
  turret:
    catalog_needs_player: "&cThe catalog is a GUI: only a player can open it."
    no_access: "&cYou can't manage this turret: it isn't yours or your team's."
    give_usage: "&eUsage: /trapadmin turret give <id> [player] [amount]"
    give_needs_player: "&cFrom console you must name the player: /trapadmin turret give <id> <player>"
    given: "&a✔ {amount}x '{id}' given to {player}."
    player_not_found: "&cPlayer not found: {player}"
    invalid_amount: "&cInvalid amount: {value}"
    placed_by_item: "&a✔ Turret '{id}' placed ({placementId}). Only you can remove it."
    removed_by_break: "&a✔ Turret removed ({placementId}); the item was returned to you."
    not_owner: "&cThis turret isn't yours, you can't remove it."
    item_lore_place: "&7Place it wherever you want"
    item_lore_owner: "&8Only you will be able to remove it"
    usage: |-
      &eUsage: /trapadmin turret
      &7 • &bcreate
      &7 • &aedit
      &7 • &ebrowser
      &7 • &dgive
      &7 • &6catalog
      &7 • &9place
      &7 • &cremove
      &7 • &flist
    not_found: "&cThere is no turret '{id}'."
    create:
      usage: "&eUsage: /trapadmin turret create <id>"
      id_taken: "&cA turret with that id already exists."
      ok: "&a✔ Turret '{id}' created — edit it with /trapadmin turret edit {id} (or /trapadmin turret browser)."
    edit:
      usage: "&eUsage: /trapadmin turret edit <id>"
    place:
      usage: "&eUsage: /trapadmin turret place <id>"
      ok: "&a✔ Turret '{turret}' placed — instance id: {placement}"
    remove:
      usage: "&eUsage: /trapadmin turret remove <placementId>"
      ok: "&a✔ Turret '{placement}' removed."
      not_found: "&cThere is no placed turret '{placement}'."
    list:
      empty: "&7No turret has been placed yet."
      header: "&6=== Placed turrets ({count}) ==="
      entry: "&f• {placement} — type: {turret}"

protection:
  not_breakable: "&cThat block is protected by a trap — it can't be broken."
