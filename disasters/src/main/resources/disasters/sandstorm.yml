# Tormenta de arena: un ACID_RAIN de arena, solo en biomas cálidos (desierto, sabana,
# mesa). Ciega y ralentiza, el casco no sirve y entre la arena salen husks.
# Todos los campos: _reference.yml
id: sandstorm
display-name: "&e&lTormenta de Arena"
icon: SAND
description: "Una tormenta de arena barre el desierto: busca refugio."
duration: 1800
intensity: 1.0
chance: 0.02
seasons: [summer]

start-sound: "ITEM_ELYTRA_FLYING 1 0.6"

phenomena:
  - type: ACID_RAIN
    storm: false
    interval: 40
    particles: ["FALLING_DUST*80 SAND", "FALLING_DUST*30 RED_SAND", "DUST*20 #D8C38A 2"]
    particle-height: 3
    particle-spread: 9
    min-temperature: 1.01
    max-temperature: 10
    damage: 0.5
    helmet-protects: false
    armor-wear: 0
    effects: ["SLOWNESS 1 3", "BLINDNESS 1 2"]
    hit-particles: ["FALLING_DUST*10 SAND"]
    hit-sound: "BLOCK_SAND_BREAK 0.6 0.8"

  - type: MOBS
    entities: ["HUSK*3", SKELETON]
    interval: 120
    chance: 0.5
    per-player: 3
