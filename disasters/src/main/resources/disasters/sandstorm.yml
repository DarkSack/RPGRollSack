# Tormenta de arena: un ACID_RAIN de arena en biomas templados y cálidos (llanura, sabana,
# desierto, mesa, jungla). Viento que empuja, polvo que apenas deja ver, ralentiza y entierra:
# la hierba se vuelve arena, las plantas se secan y se acumulan montones de arena. Entre la
# arena salen husks. Todo lo cambiado se repone solo. Todos los campos: _reference.yml
id: sandstorm
display-name: "&e&lTormenta de Arena"
icon: SAND
description: "Una tormenta de arena barre la tierra: el viento empuja y entierra lo que pilla."
duration: 1800
intensity: 1.0
chance: 0.02
seasons: [summer]

start-sound: "ITEM_ELYTRA_FLYING 1 0.6"

phenomena:
  - type: ACID_RAIN
    storm: false
    interval: 40
    particles: ["FALLING_DUST*120 SAND", "FALLING_DUST*40 RED_SAND", "DUST*40 #D8C38A 2.5", "WHITE_ASH*30"]
    particle-height: 2
    particle-spread: 10
    min-temperature: 0.8
    max-temperature: 10
    damage: 0.5
    helmet-protects: false
    armor-wear: 0
    effects: ["SLOWNESS 1 3"]
    hit-particles: ["FALLING_DUST*10 SAND"]
    hit-sound: "BLOCK_SAND_BREAK 0.6 0.8"
    wind: 0.1
    # El desierto avanza: la hierba se cubre de arena y las plantas se secan...
    corrode: ["GRASS_BLOCK>SAND", "SHORT_GRASS>DEAD_BUSH", "FERN>DEAD_BUSH", "*_TULIP>DEAD_BUSH"]
    corrode-chance: 0.3
    # ...y se van formando montones de arena encima del suelo.
    cover: SAND
    cover-chance: 0.12
    ground-radius: 14
    ground-per-tick: 5

  - type: MOBS
    entities: ["HUSK*3", SKELETON]
    interval: 120
    chance: 0.5
    per-player: 3
