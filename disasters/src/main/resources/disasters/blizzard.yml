# Ventisca: un ACID_RAIN de nieve. Congela a quien esté fuera sin ropa de cuero, ralentiza,
# cubre el suelo de nieve, hiela el agua y trae strays. Sin lluvia para que se vea nieve.
# Todos los campos: _reference.yml
id: blizzard
display-name: "&f&lVentisca"
icon: POWDER_SNOW_BUCKET
description: "Una ventisca helada: fuera te congelarás si no llevas ropa de cuero."
duration: 2400
intensity: 1.0
chance: 0.03
seasons: [winter]

start-sound: "ITEM_ELYTRA_FLYING 1 0.4"

phenomena:
  - type: ACID_RAIN
    storm: false
    interval: 40
    particles: ["SNOWFLAKE*60", "WHITE_ASH*30"]
    particle-height: 4
    particle-spread: 8
    min-temperature: -10
    max-temperature: 10
    damage: 0.5
    helmet-protects: false
    armor-wear: 0
    effects: ["SLOWNESS 1 4"]
    hit-particles: ["SNOWFLAKE*10"]
    hit-sound: "ENTITY_PLAYER_HURT_FREEZE 0.6 1"
    freeze-ticks: 60
    leather-protects: true
    cover: SNOW
    cover-chance: 0.5
    cover-max-layers: 3
    corrode: ["WATER>ICE"]
    corrode-chance: 0.3

  - type: MOBS
    entities: ["STRAY*3", POLAR_BEAR]
    interval: 120
    chance: 0.5
    per-player: 3
    equipment: ["HEAD LEATHER_HELMET"]
