name: RPGRoll-Workers
version: 1.0.0
main: com.sack.rpgroll.workers.WorkersPlugin
api-version: "1.21"
author: Sack
description: Trabajadores autónomos con IA por reglas, necesidades, personalidad, horarios, logística, economía y eventos — habitantes del mundo, no minions.
depend: [RPGRoll]
softdepend: [SackEffects, RPGRoll-Effects, RPGRoll-Seasons, RPGRoll-Ranching, RPGRoll-Fishing, RPGRoll-Guilds, Vault]

commands:
  workersadmin:
    description: Comandos administrativos de RPGRoll-Workers (Worker Studio)
    usage: /workersadmin <browser|reload|spawn <profesion> [nombre]|designator> [args]
    permission: rpgrollworkers.admin.*
  workers:
    description: Comandos de jugador de RPGRoll-Workers
    usage: /workers <inspect|hire|fire|list>
    permission: rpgrollworkers.use

permissions:
  rpgrollworkers.admin.*:
    description: Acceso completo a comandos administrativos de Worker Studio
    default: op
  rpgrollworkers.use:
    description: Uso básico de trabajadores (inspeccionar, contratar, despedir)
    default: true
