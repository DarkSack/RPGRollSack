name: RPGRoll-Workers
version: 1.0.0
main: com.sack.rpgroll.workers.WorkersPlugin
api-version: "26.1.1"
author: Sack
description: Trabajadores autónomos con IA por reglas, necesidades, personalidad, horarios, logística, economía y eventos — habitantes del mundo, no minions.
depend: [RPGRoll]
softdepend: [RPGRoll-FX, RPGRoll-Effects, RPGRoll-Seasons, RPGRoll-Ranching, RPGRoll-Fishing, RPGRoll-Guilds, Vault, SackResourcePack]

permissions:
  rpgrollworkers.admin.*:
    description: Acceso completo a comandos administrativos de Worker Studio
    default: op
  rpgrollworkers.use:
    description: Uso básico de trabajadores (inspeccionar, contratar, despedir)
    default: true
