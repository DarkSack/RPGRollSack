# Misiones del pase. Cada una da "xp" puntos de pase al completarla.
#
# scope:  DAILY   se sortean daily-count cada día (las mismas para todos)
#         WEEKLY  se sortean weekly-count cada lunes
#         SEASON  fijas toda la temporada, se completan una vez
# type:   KILL_MOB (target: ZOMBIE...), KILL_RPG_MOB (target: id de RPGRoll-Mobs),
#         BREAK_BLOCK (target: material; no cuentan bloques puestos por jugadores),
#         FISH, LEVEL_UP, COMPLETE_QUEST (target: id de quest), PLAYTIME (minutos
#         sin estar AFK), VOTE, CLAIM_DAILY
# target: opcional; sin él cuenta cualquiera del tipo.

daily-count: 3
weekly-count: 3

