# Pase Royale · Temporada 1
#
# Cada xp-per-level puntos de pase sube un nivel. Los puntos salen de las
# misiones (missions.yml), del diario (daily.yml) y de votar (votes.yml).
# Ritmo pensado: ~1.000 puntos al día jugando y votando → los 30 niveles en
# unas 4-5 semanas, con margen dentro de las 6 que dura.
#
# free: para todos. premium: requiere rpgroll.pass.premium.
#
# requirements (opcional, vale para las dos pistas): lo que el nivel exige
# además de haber llegado a él. Se ve en /pase con ✔/✘ y se comprueba al
# reclamar. Todas las claves son opcionales:
#   character-level: 15        nivel de personaje (necesita el core RPGRoll)
#   playtime: 5h               tiempo jugado en la temporada sin AFK (30m, 5h, 1d, 2h30m)
#   season-day: 7              a partir del día 7 de la temporada
#   available-from: 2026-10-15 a partir de esa fecha
#   votes: 10                  votos totales
#   daily-streak: 3            racha actual de recompensa diaria
#   missions: 20               misiones del pase completadas esta temporada
#   quests: [camino_3]         misiones de RPGRoll-Quests completadas
#   permission: rank.vip       un permiso, y permission-name: "&6VIP" para mostrarlo
# Lo que depende de un plugin que no está (core, Quests) no se exige.
# Aquí se usan en los niveles hito: 5, 10, 15, 20, 25 y 30.
id: temporada_1
display-name: "&6&l✦ Pase Royale &7· &eTemporada 1"
