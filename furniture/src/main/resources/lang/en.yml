admin:
  help: |-
    &6/furnitureadmin
    &e • give <player> <furniture>[:version] [amount]
    &e • carpenter <player> [station] &7— opens a carpenter (for an NPC)
    &e • list &7— loaded furniture
    &e • info &7— the furniture you're looking at
    &e • nearby [radius] &7— nearby furniture
    &e • remove [radius] &7— removes nearby furniture (drops what it held)
    &e • reload
  reloaded: "&aReloaded: {count} piece(s)."
  give_usage: "&cUsage: /furnitureadmin give <player> <furniture>[:version] [amount]"
  carpenter_usage: "&cUsage: /furnitureadmin carpenter <player> [station]"
  player_not_found: "&cNot online: {player}"
  unknown_furniture: "&cThere is no furniture '{id}'."
  unknown_variant: "&c'{id}' has no version '{variant}'. It has: {variants}"
  bad_number: "&cNot a number: {value}"
  given: "&aGave &f{amount}x {name} &ato {player}."
  list_header: "&6{count} piece(s) loaded &7({placed} placed in loaded chunks)"
  list_line: "&e{category}&7: {ids}"
  info_none: "&7You're not looking at any furniture."
  info: "&6{id} &7version &f{variant} &7state &f{state} &7owner &f{owner} &7facing &f{yaw}° &7at &f{x} {y} {z}"
  nearby_header: "&6{count} piece(s) within {radius} blocks:"
  nearby_line: "&e • {id} &7at {x} {y} {z}"
  removed: "&aRemoved {count} piece(s) within {radius} blocks."

