floor_lamp:
  category: "lighting"
  name: "Lámpara de pie"
  material: "PAPER"
  model: "rpgroll_furniture:floor_lamp/default"
  placement:
    surfaces:
      - "floor"
  hitbox:
    type: "interaction"
    width: 0.6
    height: 1.9
  light:
    level: 15
  states:
    trigger: "click"
    list:
      - id: "off"
        suffix: ""
        light: 0
        sound: "block.lever.click"
      - id: "on"
        suffix: "_on"
        light: 15
        sound: "block.lever.click"
  recipe:
    materials:
      IRON_INGOT: 2
      GLOWSTONE_DUST: 4
      WHITE_WOOL: 1
    money: 25
  sounds:
    place: "block.metal.place"
    break: "block.metal.break"
