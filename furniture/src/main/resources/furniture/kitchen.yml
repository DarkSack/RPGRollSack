stove:
  category: "kitchen"
  name: "Cocina"
  lore:
    - "&7Clic para encender los fogones."
  material: "PAPER"
  model: "rpgroll_furniture:stove/default"
  placement:
    surfaces:
      - "floor"
  hitbox:
    type: "barrier"
    blocks:
      - "0,0,0"
  states:
    trigger: "click"
    list:
      - id: "off"
        suffix: ""
        light: 0
        sound: "block.fire.extinguish"
      - id: "on"
        suffix: "_on"
        light: 11
        sound: "item.flintandsteel.use"
  ambient:
    particle: "SMOKE"
    at: "0,1.1,0"
    count: 1
    spread: 0.15
    every: 16
    state: "on"
  recipe:
    materials:
      IRON_INGOT: 5
      FURNACE: 1
    money: 45
  sounds:
    place: "block.metal.place"
    break: "block.metal.break"
