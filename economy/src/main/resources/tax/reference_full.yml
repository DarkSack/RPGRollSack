# ============================================================================
# REGLA TRIBUTARIA DE REFERENCIA — usa TODOS los campos que soporta un
# TaxRule. Documentación ejecutable. Ver la página "Economy" en la docs.
# ============================================================================

id: reference_full_example
display-name: "Impuesto de Referencia"

# SALE | INCOME | COMPANY | PROPERTY | COMMERCIAL | LUXURY — SALE dispara en /economy shop y subastas;
# PROPERTY con applies-to: [guild-territory] dispara la tarea de impuesto territorial de guilds (ver
# guild-territory-tax-interval-ticks en config.yml); el resto son solo consultables vía API por ahora.
type: SALE

rate-percent: 5

# ids de producto o categorías a las que aplica — vacío = aplica a TODO
applies-to:
  - mining
  - IRON_INGOT

enabled: true
