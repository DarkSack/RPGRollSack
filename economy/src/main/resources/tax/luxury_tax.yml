# NOTA: por ahora el motor solo dispara reglas de tipo SALE automáticamente
# (tiendas/mercado/subastas). INCOME/COMPANY/PROPERTY/COMMERCIAL/LUXURY están
# completamente modeladas y se pueden aplicar a mano vía TaxEngine#apply desde
# otro addon, pero ningún punto de este addon las dispara todavía — ver "Qué
