name: RPGRoll-Economy
version: 1.0.0
main: com.sack.rpgroll.economy.EconomyPlugin
api-version: "26.1.1"
author: Sack
description: Sistema económico avanzado — monedas múltiples, wallets, bancos y préstamos, mercado dinámico con oferta/demanda, tiendas de jugador, subastas, empresas, impuestos y libro mayor de transacciones. Provee el servicio Economy de Vault para todo el ecosistema.
depend: [RPGRoll]
softdepend: [Vault, PlaceholderAPI, RPGRoll-Guilds, RPGRoll-Seasons]

commands:
  economyadmin:
    description: Comandos administrativos de RPGRoll-Economy (Economy Studio)
    usage: /economyadmin <browser|reload|give|take|setbalance|inflation> [args]
    permission: rpgrolleconomy.admin.*
  economy:
    description: Comandos de jugador de RPGRoll-Economy
    usage: /economy <balance|pay|bank|shop|auction|company> [args]
    permission: rpgrolleconomy.use

permissions:
  rpgrolleconomy.admin.*:
    description: Acceso completo a comandos administrativos de Economy Studio
    default: op
  rpgrolleconomy.use:
    description: Uso básico de economía (balance, pagar, banco, tiendas, subastas, empresas)
    default: true
