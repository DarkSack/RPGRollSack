name: RPGRoll-Economy
version: 1.0.0
main: com.sack.rpgroll.economy.EconomyPlugin
api-version: "26.1.1"
author: Sack
description: Sistema económico avanzado — monedas múltiples, wallets, bancos y préstamos, mercado dinámico con oferta/demanda, tiendas de jugador, subastas, empresas, impuestos y libro mayor de transacciones. Provee el servicio Economy de Vault para todo el ecosistema.
depend: [RPGRoll-Lib]
softdepend: [RPGRoll, Vault, PlaceholderAPI, RPGRoll-Guilds, RPGRoll-Seasons, RPGRoll-Items, RPGRoll-Enchantments]

permissions:
  rpgrolleconomy.admin.*:
    description: Acceso completo a comandos administrativos de Economy Studio
    default: op
  rpgrolleconomy.use:
    description: Uso básico de economía (balance, pagar, banco, tiendas, subastas, empresas)
    default: true
  rpgrolleconomy.servershop:
    description: Abrir la tienda del servidor (/tienda)
    default: true
