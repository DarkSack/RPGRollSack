# Idioma de los mensajes (jugador y comandos). Opciones: es, en, pt_BR.
# Los textos viven en lang/<idioma>.yml dentro de esta carpeta de datos —
# puedes editarlos ahí directamente. Tras cambiar esto, /economyadmin reload.
language: es

# Id de la moneda usada como puente con Vault (net.milkbowl.vault.economy.Economy) — todo plugin
# externo que hable Vault (Jobs, tiendas de otros plugins, EssentialsX-style) opera sobre esta moneda.
default-currency: gold

# Con qué prioridad se registra esta economía en Vault: lowest, low, normal, high, highest.
#
# Por defecto 'highest' porque otros plugins (EssentialsX, por ejemplo) registran
# la suya con prioridad 'normal', y ante un empate Vault se queda con el que cargó
# primero. Si eso pasa, el resto del ecosistema mueve dinero en las cuentas del OTRO
# plugin mientras los mercados, bancos e impuestos de aquí siguen usando las carteras
# propias: el mismo jugador con dos saldos distintos.
#
# Ponlo en 'normal' o menos solo si quieres deliberadamente que otro plugin sea la
# economía del servidor y usar este addon únicamente por sus mercados y subastas.
vault-priority: highest

# Cada cuánto (ticks, 20 = 1 segundo) el precio de mercado se recupera un paso hacia su base-price.
market-recovery-interval-ticks: 1200

# Cada cuánto (ticks) se recalculan préstamos vencidos / se cobra interés acumulado.
loan-check-interval-ticks: 12000

# Cada cuánto (ticks) se toma una foto de la masa monetaria total para calcular inflación.
inflation-snapshot-interval-ticks: 24000

# Cada cuánto (ticks) expiran subastas vencidas y se procesan pagos/devoluciones.
auction-check-interval-ticks: 200

# Casa de Subastas (/subasta, alias abajo): los jugadores publican lo que
# tienen en la mano, a precio fijo (/subasta vender <precio>) o con pujas
# (/subasta subastar <inicial> [compra ya]). Lo comprado, lo ganado y lo que
# vence sin vender va a una caja de recogida: nada se tira ni se pierde.
auction-house:
  aliases: [ah, subastas]
  # Cuánto dura una publicación.
  duration-hours: 48
  # Publicaciones a la vez por jugador (0 = sin límite). Con el permiso
  # rpgrolleconomy.auction.limit.<nombre> se usa el mayor de "limits".
  max-listings: 5
  limits:
    vip: 10
    mvp: 20
  # Precio mínimo y máximo (0 = sin máximo) de una publicación.
  min-price: 1
  max-price: 0
  # Comisión al publicar, en % del precio: sale de la economía (no se
  # devuelve aunque no se venda). Al vender se aplican además los impuestos
  # de tipo SALE de taxes/.
  listing-fee-percent: 2
  # Cuánto tiene que subir una puja sobre la anterior (mínimo 1).
  min-bid-increment-percent: 5
  # Una puja en los últimos N segundos alarga la subasta N segundos.
  anti-snipe-seconds: 30
  # Moneda de la subasta (vacío = la moneda por defecto).
  currency: ""
  # Materiales que no se pueden publicar.
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW, LIGHT, DEBUG_STICK]
  # Ítems con alguna de estas marcas de datos (plugin:clave) no se pueden
  # publicar: mochilas ligadas a su dueño y la brújula del menú de RPGRoll-Extras.
  blocked-data-keys: ["rpgrollextras:backpack_bound", "rpgrollextras:server_menu_item"]

# Integración activa con RPGRoll-Guilds (softdepend — sin nada si no está instalado): cada guild paga
# un impuesto PROPERTY periódico por cada GuildTerritory que tenga reclamada, descontado de su vault.
# El monto real depende de que exista una TaxRule tipo PROPERTY con appliesTo: [guild-territory] (o
# appliesTo vacío) — sin esa regla el impuesto es 0 y esta tarea no hace nada.
guild-territory-tax-interval-ticks: 24000
guild-territory-tax-per-territory: 50.0

# Tienda del servidor (/tienda). Sus secciones son los YAML de server-shop/.
server-shop:
  # Otros nombres para /tienda. Se aplican al reiniciar.
  aliases: [shop]
  # En las líneas enlazadas a un producto del mercado (market: DIAMOND), qué
  # fracción de su precio de mercado se paga al jugador que vende. Por debajo
  # de 1 para que comprar y revender en el acto no dé dinero.
  market-sell-ratio: 0.4
