name: RPGRoll-Structures
version: 1.1.0
main: com.sack.rpgroll.structures.StructuresPlugin
api-version: "26.1.1"
author: Sack
description: Mesas de construcción y estructuras para RPGRoll
depend: [RPGRoll-Lib]
libraries: ["org.mariadb.jdbc:mariadb-java-client:3.5.11"]
softdepend: [SackResourcePack, WorldEdit, FastAsyncWorldEdit, WorldGuard, GriefPrevention, Vault, floodgate, RPGRoll-Items, RPGRoll-Furniture, MythicMobs]

permissions:
  rpgrollstructures.use:
    description: Usar RPGRoll-Structures
    default: true
  rpgrollstructures.workbench.place:
    description: Colocar mesas de construcción
    default: true
  rpgrollstructures.workbench.break:
    description: Romper mesas de construcción propias
    default: true
  rpgrollstructures.tier.*:
    description: Mejorar la mesa a cualquier nivel
    default: true
    children:
      rpgrollstructures.tier.2: true
      rpgrollstructures.tier.3: true
  rpgrollstructures.tier.2:
    description: Mejorar la mesa a nivel 2 (Ingeniero)
    default: true
  rpgrollstructures.tier.3:
    description: Mejorar la mesa a nivel 3 (Arquitecto)
    default: true
  rpgrollstructures.bypass:
    description: Saltarse las restricciones de las mesas y la protección de la zona (WorldGuard, GriefPrevention) al confirmar o arrancar obras
    default: op
  rpgrollstructures.admin.give:
    description: Dar mesas
    default: op
  rpgrollstructures.admin.reload:
    description: Recargar RPGRoll-Structures
    default: op
  rpgrollstructures.build:
    description: Construir estructuras con la mesa
    default: true
  rpgrollstructures.preview:
    description: Ver la vista previa de una estructura
    default: true
  rpgrollstructures.build.*:
    description: Construir cualquier estructura (rpgrollstructures.build.<id> una sola)
    default: true
  rpgrollstructures.category.*:
    description: Ver cualquier categoría del catálogo (rpgrollstructures.category.<cat> una sola)
    default: true
  rpgrollstructures.admin.validate:
    description: Validar las estructuras y sus archivos
    default: op
  rpgrollstructures.admin:
    description: Administrar RPGRoll-Structures
    default: op
    children:
      rpgrollstructures.bypass: true
      rpgrollstructures.admin.give: true
      rpgrollstructures.admin.reload: true
      rpgrollstructures.admin.validate: true
