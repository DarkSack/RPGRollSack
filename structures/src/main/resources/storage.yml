# Base de datos de las mesas: sqlite (un archivo) o mysql.
# Una base por servidor; no compartirla entre servidores (con MySQL, un `database` distinto en cada uno).
# Cambiar este archivo pide reiniciar el servidor: /structuresadmin reload no lo vuelve a leer.
type: sqlite
sqlite:
  file: data.db
mysql:
  host: localhost
  port: 3306
  database: rpgrollstructures
  user: root
  password: ""
