# Id publico de cada producto en voxel.shop: el numero que va en la URL del
# listing (ej. voxel.shop/product/10170/rpgroll -> 10170).
#
# Se inyecta al compilar en la clase LicenseIdentity de cada modulo, asi que
# queda como constante en el bytecode y no como texto editable por el comprador.
#
# OJO: este numero es SOLO para voxel.shop. La tienda propia identifica cada
# producto por su slug, que es la CLAVE de estas lineas (mobs, tab, core...) y
# coincide con rpgroll.products.slug en Supabase; Gradle la compila aparte, en
# LicenseIdentity.PRODUCT_SLUG. Por eso un "0" de aca no rompe las ventas
# directas: solo impide validar una compra hecha en el marketplace.
#
# "0" = sin publicar todavia en voxel.shop. Completar antes de vender ahi.
core=10170
npcs=0
crates=0
enchantments=0
quests=0
items=0
ascension=0
mobs=0
dungeons=0
guilds=0
chat=0
fx=0
effects=0
magic=0
seasons=0
fishing=0
sackresourcepack=0
ranching=0
workers=0
economy=0
crafting=0
tab=0
extras=0
traps=0

# Token que el plugin manda al verificar contra el servicio propio. Vacio = no
# se manda. Tiene que coincidir con VERIFY_TOKEN en el despliegue de la tienda.
# En CI conviene pasarlo por la variable de entorno RPGROLL_VERIFY_TOKEN en vez
# de escribirlo aca.
verify.token=
