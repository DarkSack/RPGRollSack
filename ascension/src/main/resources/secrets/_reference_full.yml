# ============================================================================
# SECRETO DE REFERENCIA — no se carga (guion bajo).
# Un secreto cumplido queda desbloqueado para siempre.
# ============================================================================
id: reference_full_example

# Qué esconde:
#   RACE / CLASS    no se puede elegir (al crear el personaje, /race, /class)
#                   hasta cumplir los requisitos. Como una raza o clase ya
#                   elegida no se cambia, al cumplirlos el jugador puede
#                   adoptarla con /ascend secret claim <id>.
#   TRAIT           rasgo de RPGRoll: se concede solo al cumplirlos.
#   SPECIALIZATION  especialización de Ascension: /ascend specialize no la
#                   deja tomar hasta cumplirlos.
target-type: CLASS
target-id: guerrero

# Lo que ve el jugador en /ascend secrets mientras sigue bloqueado.
# Sin pista, solo ve que existe algo oculto.
hint: "Una pista, sin revelar el requisito"

requirements:
  level: 40
  prestige: 1
  trait: vision_nocturna
  completed-quests: [tutorial]
  reputation:
    kingdom: 2500
