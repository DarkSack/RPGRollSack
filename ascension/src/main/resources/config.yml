# Configuración de RPGRoll-Ascension

# Idioma de los mensajes (jugador y comandos). Opciones: es, en, pt_BR.
# Los textos viven en lang/<idioma>.yml dentro de esta carpeta de datos —
# puedes editarlos ahí directamente. Tras cambiar esto, /ascendadmin reload.
language: es

# Puntos de talento que da cada nivel de personaje, a partir de qué nivel.
# Un árbol de especialización de fábrica cuesta 11 puntos; pon per-level en 0 para
# que solo salgan de logros y otras recompensas.
talent-points:
  from-level: 20
  per-level: 1
