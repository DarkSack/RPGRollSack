# Archivo de idioma: Español
# RPGRoll-NPCs - Sistema de mensajes

# Mensajes generales
general:
  no_permission: "&cNo tienes permiso para usar este comando."
  player_only: "&cEste subcomando solo puede ser usado por jugadores."

# Comando /npc (admin)
command:
  usage: "&cUso: /npc <create|edit|list|delete|reload|menus> [id]"
  not_found: "&cNo existe ese NPC."
  create:
    usage: "&cUso: /npc create <id>"
    already_exists: "&cYa existe un NPC con ese id."
  edit:
    usage: "&cUso: /npc edit <id>"
  list:
    empty: "&7No hay NPCs creados."
    header: "&6NPCs existentes:"
  delete:
    usage: "&cUso: /npc delete <id>"
    success: "&a✔ NPC eliminado: {id}"
  reload:
    success: "&a✔ Recargado: {npcCount} NPC(s), {menuCount} menú(s)."

# Prompts genéricos del sistema de captura de chat (ChatPromptManager)
prompt:
  instructions: "&7Escribe en el chat, o 'cancelar' para abortar."
  cancelled: "&cCancelado."

# GUI "Selecciona una Pose"
