# Language file: English
# RPGRoll-NPCs - Message system

# General messages
general:
  no_permission: "&cYou don't have permission to use this command."
  player_only: "&cThis subcommand can only be used by players."

# /npc command (admin)
command:
  usage: |-
    &cUsage: /npc
    &7 • &bcreate
    &7 • &aedit
    &7 • &elist
    &7 • &ddelete
    &7 • &6reload
    &7 • &9menus
    &8   [id]
  not_found: "&cThat NPC doesn't exist."
  create:
    usage: "&cUsage: /npc create <id>"
    already_exists: "&cAn NPC with that id already exists."
  edit:
    usage: "&cUsage: /npc edit <id>"
  list:
    empty: "&7No NPCs have been created."
    header: "&6Existing NPCs:"
  delete:
    usage: "&cUsage: /npc delete <id>"
    success: "&a✔ NPC deleted: {id}"
  reload:
    success: "&a✔ Reloaded: {npcCount} NPC(s), {menuCount} menu(s)."

# Generic prompts from the chat capture system (ChatPromptManager)
prompt:
  instructions: "&7Type in chat, or 'cancelar' to abort."
  cancelled: "&cCancelled."

# "Select a Pose" GUI
pose:
  title: "&6&lSelect a Pose"
  back: "Back"

# NPC Editor GUI (/npc create, /npc edit)
adminGui:
  title: "&6&lNPC Editor: {id}"
  name_label: "&6&lName"
  click_to_change: "&7Click to change"
  skin_label: "&6&lSkin"
  skin_none: "&7No custom skin"
  skin_click_configure: "&7Click to configure"
  skin_configured: "&aSkin configured ✔"
  pose_label: "&6&lPose"
  position_label: "&6&lPosition"
  position_none: "&cNo location assigned"
  position_click: "&7Click to use your current location"
  actions_label: "&6&lActions"
  actions_count: "&f{count} action(s) configured"
  actions_click_manage: "&7Click to manage"
  save: "Save"
  save_incomplete: "Save (missing position or name)"
  cancel: "Cancel"
  prompt_name: "Type the new name for the NPC:"
  prompt_skin: "Paste the MineSkin link or ID:"
  skin_querying: "&7Querying MineSkin..."
  skin_applied: "&a✔ Skin applied."
  skin_resolve_failed: "&cCouldn't resolve the skin."
  location_assigned: "&a✔ Location assigned."
  save_missing_fields: "&cName or position missing before saving."
