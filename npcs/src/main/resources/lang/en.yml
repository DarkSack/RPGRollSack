  edit_cancelled: "&eEditing cancelled."

# "NPC Actions" GUI
actions:
  title: "&6&lNPC Actions"
  click_to_delete: "&cClick to delete"
  add: "Add action"
  back: "Back"
  prompt_add: "Type: TYPE|value (e.g: MESSAGE|Hello {player}, COMMAND|give {player} diamond 1 [console], or COMMAND_AS_PLAYER|quest start x [as the player])"
  invalid_format: "&cInvalid format. Use TYPE|value"
  invalid_type: "&cInvalid type: {type}"

# NPC menu GUIs (browser and editor)
menu:
  browser:
    title: "&6RPGRoll NPC Menus"
    item_lore: "&7{items} item(s) · {rows} row(s)"
    click_to_edit: "&eClick to edit"
    create_new: "&aCreate new menu"
    close: "Close"
    prompt_new_id: "Type the id of the new menu:"
    already_exists: "&cA menu with that id already exists."
  editor:
    title: "&6Menu: {id}"
    title_label: "Title: {title}"
    title_hint: "&7Click to type a new one"
    rows_label: "&eRows: {rows}"
    rows_hint: "&7Click: +1 · Right click: -1 (1-6)"
    item_lore: "&7Slot {slot} · {count} action(s)"
    item_hint: "&8Click to add an action · Shift-click to remove"
    add_item: "&aAdd item to menu"
    back: "Back"
    prompt_title: "Type the new title for the menu:"
    prompt_item: "Type: slot;material;name (e.g. 11;IRON_SWORD;&fSword):"
    prompt_action: "Type: TYPE;value (e.g. GIVE_ITEM;SHIELD,1 — types: {types}):"
    invalid_format: "&cInvalid format."
    invalid_slot_number: "&cThe slot must be a number."
    invalid_action_type: "&cInvalid action type."
