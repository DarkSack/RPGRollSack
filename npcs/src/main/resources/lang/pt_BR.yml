# Arquivo de idioma: Português do Brasil
# RPGRoll-NPCs - Sistema de mensagens

# Mensagens gerais
general:
  no_permission: "&cVocê não tem permissão para usar este comando."
  player_only: "&cEste subcomando só pode ser usado por jogadores."

# Comando /npc (admin)
command:
  usage: |-
    &cUso: /npc
    &7 • &bcreate
    &7 • &aedit
    &7 • &elist
    &7 • &ddelete
    &7 • &6reload
    &7 • &9menus
    &8   [id]
  not_found: "&cEsse NPC não existe."
  create:
    usage: "&cUso: /npc create <id>"
    already_exists: "&cJá existe um NPC com esse id."
  edit:
    usage: "&cUso: /npc edit <id>"
  list:
    empty: "&7Nenhum NPC foi criado."
    header: "&6NPCs existentes:"
  delete:
    usage: "&cUso: /npc delete <id>"
    success: "&a✔ NPC removido: {id}"
  reload:
    success: "&a✔ Recarregado: {npcCount} NPC(s), {menuCount} menu(s)."

# Prompts genéricos do sistema de captura de chat (ChatPromptManager)
prompt:
  instructions: "&7Digite no chat, ou 'cancelar' para abortar."
  cancelled: "&cCancelado."

# GUI "Selecione uma Pose"
pose:
  title: "&6&lSelecione uma Pose"
  back: "Voltar"

