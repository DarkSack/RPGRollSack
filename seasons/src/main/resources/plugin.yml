name: RPGRoll-Seasons
version: 1.0.0
main: com.sack.rpgroll.seasons.SeasonsPlugin
api-version: "26.1.1"
author: Sack
description: Calendario y estaciones 100% personalizables — clima, temperatura por bioma, vegetación dinámica, mobs/jefes de temporada y eventos mundiales.
depend: [RPGRoll]
softdepend: [RPGRoll-FX, RPGRoll-Effects, RPGRoll-Mobs]

permissions:
  rpgrollseasons.admin.*:
    description: Acceso completo a comandos administrativos de Season Studio
    default: op
  rpgrollseasons.use:
    description: Consultar información de estación/clima
    default: true
