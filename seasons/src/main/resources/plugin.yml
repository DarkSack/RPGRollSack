name: RPGRoll-Seasons
version: 1.0.0
main: com.sack.rpgroll.seasons.SeasonsPlugin
api-version: "1.21"
author: Sack
description: Calendario y estaciones 100% personalizables — clima, temperatura por bioma, vegetación dinámica, mobs/jefes de temporada y eventos mundiales.
depend: [RPGRoll]
softdepend: [SackEffects, RPGRoll-Effects, RPGRoll-Mobs]

commands:
  seasonsadmin:
    description: Comandos administrativos de RPGRoll-Seasons (Season Studio)
    usage: /seasonsadmin <browser|reload|setseason <mundo> <id>|advance <mundo>|trigger <id> <mundo>> [args]
    permission: rpgrollseasons.admin.*
  seasons:
    description: Comandos de jugador de RPGRoll-Seasons
    usage: /seasons info [mundo]
    permission: rpgrollseasons.use

permissions:
  rpgrollseasons.admin.*:
    description: Acceso completo a comandos administrativos de Season Studio
    default: op
  rpgrollseasons.use:
    description: Consultar información de estación/clima
    default: true
