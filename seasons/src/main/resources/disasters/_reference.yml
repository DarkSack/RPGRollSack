# ============================================================================
# DESASTRES NATURALES — referencia de TODOS los campos, con su valor por defecto.
# Este archivo no se carga (empieza por "_"): cópialo con otro nombre para crear
# uno nuevo. Los de esta carpeta (tornado, meteor_storm, acid_rain, earthquake,
# hailstorm, blizzard, sandstorm, apocalypse) son ejemplos reales.
#
# Un desastre junta uno o varios FENÓMENOS que ocurren a la vez. Hay cuatro
# tipos de fenómeno y cada uno es una plantilla: cambiando sus partículas,
# bloques, sonidos y números sale un desastre distinto (el granizo es un
# METEOR_STORM de hielo; la ventisca y la tormenta de arena son ACID_RAIN).
#
# Probar:   /seasonsadmin disaster start <id> [mundo] [intensidad]
# Cortar:   /seasonsadmin disaster stop [mundo]
# Ver:      /seasonsadmin disaster list
# Recargar: /seasonsadmin reload
#
# Ningún desastre rompe ni pone bloques: grietas y cráteres son solo visuales y
# se deshacen solos, y lo que cae (meteoritos, granizo, rocas) desaparece al
# tocar el suelo. Nadie sufre nada cerca del spawn (disasters.safe-radius de
# config.yml). Se ve igual en Java y en Bedrock.
#
# FORMATOS (separados por espacios):
#   partícula:  NOMBRE[*cantidad] [dato] [tamaño]
#               el dato es un bloque (BLOCK, FALLING_DUST), un color #RRGGBB
#               (DUST) o un objeto (ITEM). Ej. "FALLING_DUST*30 SAND",
#               "DUST*8 #7CFC00 1.2", "FLAME*4". Nombres: los de Particle de Paper.
#   sonido:     NOMBRE [volumen] [tono]   ej. "ENTITY_GENERIC_EXPLODE 4 0.7"
#               también una clave del pack de recursos: "sackito:viento 2 1".
#               "" = sin sonido.
#   efecto:     NOMBRE [nivel] [segundos]  ej. "SLOWNESS 2 5"
#   bloque:     nombre de Material, ej. MAGMA_BLOCK
# Lo que esté mal escrito se avisa una vez en consola y se usa el de por defecto.
# Los valores marcados ×intensidad se multiplican por la intensidad.
# ============================================================================

id: reference_example
display-name: "&4&lDesastre de Referencia"
icon: TNT
description: "Se lee en el aviso del chat ({description})."

# Cuánto dura, en ticks (20 = 1 s).
duration: 1200

# Multiplica la fuerza de todos sus fenómenos (lo marcado ×intensidad).
# El comando puede pasar otra: /seasonsadmin disaster start reference_example mundo 2
intensity: 1.0

# Probabilidad (0.0-1.0) de que salga solo en un día de Minecraft en cada mundo.
# 0 = solo por comando. Como mucho sale un desastre al día por mundo, y nunca
# dos a la vez en el mismo mundo.
chance: 0.0

# Estaciones en las que puede salir solo (ids de seasons/). Vacío = cualquiera.
seasons: []

# Mundos en los que puede salir solo. Vacío = todos los que tienen estaciones
# (los de disabled-worlds de config.yml nunca).
worlds: []

# Suma los fenómenos de otros desastres (por id). Así se combinan dos o más:
# combine: [tornado, acid_rain]
combine: []

# Textos propios. El que falte sale de lang/<idioma>.yml (sección disaster:);
# "" lo quita. {disaster} = display-name, {description} = description.
messages:
  start: "&4⚠ &c{disaster}&4 ⚠ &7{description}"
  title: "{disaster}"
  subtitle: "&7¡Busca refugio!"
  end: "&a✔ &7{disaster}&7 ha pasado."

# Sonido para cada jugador del mundo al empezar.
start-sound: "EVENT_RAID_HORN 1 0.8"

# Comandos de consola al empezar y al terminar. %world% y %disaster% (el id).
commands:
  start: []
  end: []

phenomena:

  # --------------------------------------------------------------------------
  # Campos que admiten TODOS los fenómenos:
  #   period:    ticks entre pasos (por defecto el de cada tipo)
  #   storm:     lluvia mientras dura (TORNADO y ACID_RAIN: true; el resto: false).
  #              Al terminar el tiempo vuelve a como estaba.
  #   thunder:   truenos mientras dura (false)
  #   hit-mobs:  si también afecta a los mobs (true; ACID_RAIN: false)
  #   hit-items: si mueve objetos sueltos del suelo (true)
  #   effects:   efectos de poción para cada ser vivo al que golpea ([])
  # --------------------------------------------------------------------------

  # Embudo que nace lejos de un jugador y va hacia los jugadores; arrastra en
  # espiral, sube por el centro y lanza hacia fuera. No sale en Nether ni End.
  - type: TORNADO
    period: 2
    storm: true
    height: 26                 # alto del embudo
    radius: 12                 # alcance del arrastre
    core-radius: 2.5           # dentro de esto ya no arrastra: sube
    speed: 0.2                 # bloques por tick que avanza
    retarget-ticks: 200        # cada cuánto elige otro jugador al que ir
    wander: 20                 # cuánto se desvía de ese jugador
    spawn-distance-min: 30     # a qué distancia de un jugador nace
    spawn-distance-max: 45
    pull: 0.45                 # fuerza del arrastre (×intensidad)
    swirl: 0.8                 # cuánto gira lo arrastrado (fracción de pull)
    lift-speed: 0.55           # velocidad de subida en el centro
    lift-height: 14            # hasta cuántos bloques sube antes de lanzar
    fling: 1.5                 # fuerza del lanzamiento (×intensidad)
    fling-up: 0.6
    fling-cooldown: 60         # ticks que alguien lanzado no vuelve a ser atrapado
    damage: 4                  # daño al lanzar, además de la caída (×intensidad)
    funnel-particles: [CLOUD, LARGE_SMOKE, "DUST #6B6B6B 3", CLOUD, LARGE_SMOKE]   # un brazo por partícula
    funnel-base-radius: 0.6    # radio abajo
    funnel-growth: 0.25        # cuánto se abre por bloque de alto
    ring-spacing: 0.8          # bloques entre anillos (menos = más partículas)
    twist: 0.45                # cuánto se retuerce con la altura
    spin-speed: 0.35           # velocidad de giro
    particle-speed: 0.08       # velocidad con que salen las partículas
    ground-particles: 24       # polvo del suelo en la base (0 = nada)
    debris: 14                 # escombros girando (0 = nada)
    debris-blocks: [DIRT, OAK_LEAVES, COBBLESTONE]
    debris-from-ground: true   # a veces, el bloque que pisa
    sound: "ITEM_ELYTRA_FLYING 4 0.5"
    sound-every: 30            # ticks entre sonidos (0 = sin sonido)
    # Arrancar bloques de verdad. Solo la cima de cada columna (primero la hierba y
    # las copas de los árboles), nunca hojas puestas por jugadores ni nada dentro de
    # un claim de GriefPrevention o de lo que otro plugin (WorldGuard...) proteja
    # de explosiones.
    break-blocks: false        # tornado.yml lo trae activado
    break-radius: 5            # alrededor del centro
    break-height: 16           # hasta cuántos bloques por encima de la base
    break-per-tick: 6          # columnas que prueba en cada pasada
    restore-seconds: 120       # cuándo se repone lo arrancado (0 = nunca)
    # Qué puede arrancar; * vale por cualquier texto (*_LEAVES = todas las hojas).
    breakable-blocks: [SHORT_GRASS, TALL_GRASS, FERN, LARGE_FERN, DEAD_BUSH, BUSH,
      SHORT_DRY_GRASS, TALL_DRY_GRASS, LEAF_LITTER, FIREFLY_BUSH, WILDFLOWERS, VINE,
      SNOW, DANDELION, POPPY, BLUE_ORCHID, ALLIUM, AZURE_BLUET, OXEYE_DAISY,
      CORNFLOWER, "*_TULIP", SUNFLOWER, LILAC, ROSE_BUSH, PEONY, "*_LEAVES"]

  # Bloques que caen en diagonal con estela y estallan cerca de los jugadores.
  # No sale en Nether ni End.
  - type: METEOR_STORM
    period: 1
    interval: 30               # ticks entre oleadas
    chance: 0.5                # probabilidad por jugador y oleada (×intensidad)
    spread-min: 0              # a cuántos bloques del jugador caen, de spread-min a spread
    spread: 32
    blocks: [MAGMA_BLOCK]      # lo que cae (uno al azar)
    speed: 1.4                 # bloques por tick
    start-distance: 48         # de cuán lejos viene
    slant: 1                   # inclinación (0 = cae recto)
    max-flight-ticks: 120      # se borra si no ha caído en este tiempo
    trail-particles: ["FLAME*4", "LARGE_SMOKE*2"]
    impact-particles: ["EXPLOSION_EMITTER*1", "LAVA*25"]
    impact-sound: "ENTITY_GENERIC_EXPLODE 4 0.7"
    impact-radius: 4
    damage: 8                  # en el centro; menos cuanto más lejos (×intensidad)
    knockback: 0.8
    only-open-sky: true        # a cubierto no le llega
    crater-radius: 2           # 0 = sin cráter
    crater-center: MAGMA_BLOCK
    crater-blocks: [BLACKSTONE, COBBLED_DEEPSLATE]
    crater-seconds: 40

  # Algo cae del cielo sobre quien está a la intemperie y le daña o le pone
  # efectos; un casco puede protegerle a costa de desgastarse. No sale en Nether ni End.
  - type: ACID_RAIN
    period: 5
    storm: true
    interval: 20               # ticks entre golpes
    particles: ["FALLING_DUST*30 LIME_CONCRETE_POWDER"]
    particle-height: 7
    particle-spread: 7
    min-temperature: 0.15      # solo en biomas con esta temperatura (vanilla):
    max-temperature: 1.0       #   0.15-1.0 = donde llueve; >1 desiertos; <0.15 donde nieva
    only-open-sky: true
    damage: 1.5                # (×intensidad)
    helmet-protects: true      # con casco no hay daño ni efectos...
    armor-wear: 3              # ...pero pierde esta durabilidad por golpe (×intensidad)
    hit-particles: ["DUST*8 #7CFC00 1.2"]
    hit-sound: "BLOCK_FIRE_EXTINGUISH 0.6 1.6"
    helmet-sound: "BLOCK_FIRE_EXTINGUISH 0.4 1.8"
    hit-mobs: false
    mob-radius: 24             # si hit-mobs, mobs a esta distancia de los jugadores

  # Sacudidas, polvo y estruendo bajo cada jugador; grietas visuales y, bajo
  # techo o en cuevas, rocas que caen. También en el Nether y el End.
  - type: EARTHQUAKE
    period: 10
    shake: 0.18                # fuerza de la sacudida (×intensidad)
    shake-up: 0.6              # parte vertical de la sacudida
    ground-particles: 12       # polvo del bloque que pisa (0 = nada)
    rumble-sound: "BLOCK_BASALT_BREAK 1 0.5"
    boom-sound: "ENTITY_WARDEN_DIG 0.8 0.6"
    boom-every: 40             # ticks entre estruendos (0 = nunca)
    cracks: 0.25               # probabilidad de grieta por jugador y paso
    crack-blocks: [BLACKSTONE]
    crack-distance: 2          # a cuántos bloques del jugador empieza
    crack-length-min: 5        # largo (×intensidad, hasta crack-length-cap)
    crack-length-max: 11
    crack-length-cap: 16
    crack-jitter: 1            # cuánto zigzaguea
    crack-seconds: 30
    rocks: 0.12                # probabilidad de roca bajo techo por paso (×intensidad)
    rock-blocks: []            # vacío = el bloque del propio techo
    rock-fallback: COBBLESTONE # si el techo es un cofre, una puerta...
    rock-scatter: 3
    rock-radius: 1.2           # a quién alcanza al caer
    rock-sound: "BLOCK_STONE_BREAK 1 0.7"
    ceiling-search: 8          # hasta cuántos bloques encima busca techo
    damage: 3                  # de una roca (×intensidad)
