# Tormenta de arena: un ACID_RAIN de arena, solo en biomas cálidos (desierto, sabana,
# mesa). Ciega un poco y ralentiza; el casco no sirve. Todos los campos: _reference.yml
id: sandstorm
display-name: "&e&lTormenta de Arena"
icon: SAND
description: "Una tormenta de arena barre el desierto: busca refugio."
duration: 1800
intensity: 1.0
chance: 0.02
seasons: [summer]

start-sound: "ITEM_ELYTRA_FLYING 1 0.6"

phenomena:
  - type: ACID_RAIN
    storm: false
    interval: 40
    particles: ["FALLING_DUST*50 SAND", "FALLING_DUST*20 RED_SAND"]
    particle-height: 3
    particle-spread: 9
    min-temperature: 1.01
    max-temperature: 10
    damage: 0.5
    helmet-protects: false
    effects: ["SLOWNESS 1 3", "DARKNESS 1 3"]
    hit-particles: ["FALLING_DUST*10 SAND"]
    hit-sound: "BLOCK_SAND_BREAK 0.6 0.8"
