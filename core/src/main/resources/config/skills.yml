# Skills (Habilidades) disponibles en RPGRoll
# Cada skill requiere un nivel mínimo para ser aprendida

skills:
  # GUERRERO
  slash:
    name: "Tajo"
    description: "Ataque rápido con la espada"
    required_level: 1
    mana_cost: 0
    cooldown_seconds: 2
    damage_multiplier: 1.2

  power_strike:
    name: "Golpe Poderoso"
    description: "Ataque devastador que gasta energía"
    required_level: 5
    mana_cost: 20
    cooldown_seconds: 6
    damage_multiplier: 2.0

  whirlwind:
    name: "Remolino de Hojas"
    description: "Ataque circular que golpea múltiples enemigos"
    required_level: 15
    mana_cost: 40
    cooldown_seconds: 10
    damage_multiplier: 1.8

  # MAGO
  fireball:
    name: "Bola de Fuego"
    description: "Lanza una esfera de fuego ardiente"
    required_level: 3
    mana_cost: 30
    cooldown_seconds: 5
    damage_multiplier: 1.5

  frost_bolt:
    name: "Rayo de Hielo"
    description: "Congela al enemigo ralentizándolo"
    required_level: 5
    mana_cost: 25
    cooldown_seconds: 4
    damage_multiplier: 1.3

  meteor_strike:
    name: "Lluvia de Meteoritos"
    description: "Invoca meteoritos desde el cielo"
    required_level: 20
    mana_cost: 80
    cooldown_seconds: 15
    damage_multiplier: 3.0

  # PÍCARO
  backstab:
    name: "Puñalada Traicionera"
    description: "Ataque silencioso desde las sombras"
    required_level: 2
    mana_cost: 10
    cooldown_seconds: 3
    damage_multiplier: 2.5

  evasion:
    name: "Evasión"
    description: "Aumenta temporalmente la evasión"
    required_level: 10
    mana_cost: 15
    cooldown_seconds: 8
    damage_multiplier: 0.0

  poison_strike:
    name: "Golpe Envenenado"
    description: "Enveneña al enemigo infligiendo daño continuo"
    required_level: 12
    mana_cost: 20
    cooldown_seconds: 7
    damage_multiplier: 1.4

  # CLÉRIGO
  heal:
    name: "Curación"
    description: "Restaura la salud del aliado"
    required_level: 1
    mana_cost: 25
    cooldown_seconds: 4
    damage_multiplier: 0.0

  holy_light:
    name: "Luz Sagrada"
    description: "Cura y protege simultáneamente"
    required_level: 8
    mana_cost: 35
    cooldown_seconds: 6
    damage_multiplier: 1.2

  resurrection:
    name: "Resurrección"
    description: "Devuelve la vida a un aliado caído"
    required_level: 25
    mana_cost: 100
    cooldown_seconds: 30
    damage_multiplier: 0.0

  # PALADÍN
  shield_bash:
    name: "Golpe de Escudo"
    description: "Ataque defensivo que bloquea el daño"
    required_level: 3
    mana_cost: 15
    cooldown_seconds: 5
    damage_multiplier: 1.1

  divine_protection:
    name: "Protección Divina"
    description: "Envuelve al aliado en defensa celestial"
    required_level: 10
    mana_cost: 30
    cooldown_seconds: 8
    damage_multiplier: 0.0

  crusader_strike:
    name: "Golpe del Cruzado"
    description: "Ataque sagrado que daña y cura"
    required_level: 16
    mana_cost: 40
    cooldown_seconds: 7
    damage_multiplier: 1.7

  # DRUIDA
  regrowth:
    name: "Regeneración"
    description: "Cura continuamente a un aliado"
    required_level: 4
    mana_cost: 20
    cooldown_seconds: 3
    damage_multiplier: 0.0

  entangle:
    name: "Enredadera"
    description: "Atrapa al enemigo en raíces"
    required_level: 7
    mana_cost: 25
    cooldown_seconds: 6
    damage_multiplier: 0.8

  wild_shape:
    name: "Forma Bestial"
    description: "Transforma el cuerpo del druida en bestia"
    required_level: 18
    mana_cost: 50
    cooldown_seconds: 12
    damage_multiplier: 2.2
