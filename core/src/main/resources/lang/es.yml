# Archivo de idioma: Español
# RPGRoll - Sistema de mensajes

# Mensajes generales
general:
  prefix: "&7[&6RPGRoll&7]&r"
  no_permission: "&cNo tienes permiso para usar este comando."
  player_only: "&cEste comando solo puede ser usado por jugadores."
  unknown_command: "&cComando desconocido. Usa &e/rpg help&c para ver los comandos disponibles."
  config_reloaded: "&aConfiguración recargada correctamente."
  reloading: "&eRecargando configuración y contenido..."

# Sistema de jugadores
player:
