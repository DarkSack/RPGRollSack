  current_exp: "&aExperiência: &e{current}/{required}"
  exp_to_next: "&aExperiência para o próximo nível: &e{remaining}"

# Sistema de atributos
stats:
  view_stats: "&6=== Atributos de {player} ==="
  strength: "&cForça: &f{value}"
  dexterity: "&aDestreza: &f{value}"
  constitution: "&6Constituição: &f{value}"
  intelligence: "&9Inteligência: &f{value}"
  wisdom: "&bSabedoria: &f{value}"
  charisma: "&dCarisma: &f{value}"
  points_available: "&ePontos disponíveis: &f{points}"
  stat_increased: "&a{stat} aumentado para {value}!"
