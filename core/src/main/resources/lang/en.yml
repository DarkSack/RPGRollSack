# Language file: English
# RPGRoll - Message system

# General messages
general:
  prefix: "&7[&6RPGRoll&7]&r"
  no_permission: "&cYou don't have permission to use this command."
  player_only: "&cThis command can only be used by players."
  unknown_command: "&cUnknown command. Use &e/rpg help&c to see the available commands."
  config_reloaded: "&aConfiguration reloaded successfully."
  reloading: "&eReloading configuration and content..."

# Player system
player:
  data_loading: "&eLoading player data..."
  data_loaded: "&aData loaded successfully!"
  data_error: "&cError loading data. Please contact an administrator."
  first_join: "&eWelcome to RPGRoll! Choose your race and class to get started."

# Level system
level:
  level_up: "&aCongratulations! You reached level &e{level}&a!"
  exp_gained: "&a+{exp} EXP"
  max_level: "&eYou have reached the maximum level."
  current_level: "&aCurrent level: &e{level}"
  current_exp: "&aExperience: &e{current}/{required}"
  exp_to_next: "&aExperience to next level: &e{remaining}"

# Stats system
stats:
  view_stats: "&6=== {player}'s Stats ==="
  strength: "&cStrength: &f{value}"
  dexterity: "&aDexterity: &f{value}"
  constitution: "&6Constitution: &f{value}"
  intelligence: "&9Intelligence: &f{value}"
  wisdom: "&bWisdom: &f{value}"
  charisma: "&dCharisma: &f{value}"
  points_available: "&eAvailable points: &f{points}"
  stat_increased: "&a{stat} increased to {value}!"
  stat_max: "&cThis stat is already at its maximum!"
  no_points: "&cYou don't have any stat points available."
  invalid_stat: "&cInvalid stat. Use: strength, dexterity, constitution, intelligence, wisdom, charisma"
  footer: "&6======================================"

# Class system
class:
  select: "&aYou selected the class: &e{class}"
  current: "&aYour current class: &e{class}"
  no_class: "&cYou haven't selected a class yet."
  cannot_change: "&cYou can't change your class."
  min_level: "&cYou need level {level} to select a class."
  list: "&6Available classes: &e{classes}"

# Race system
race:
  select: "&aYou selected the race: &e{race}"
  current: "&aYour current race: &e{race}"
  no_race: "&cYou haven't selected a race yet."
  cannot_change: "&cYou can't change your race."
  list: "&6Available races: &e{races}"

# Skill system
skill:
  activated: "&aSkill &e{skill}&a activated!"
  cooldown: "&cThis skill is on cooldown. Wait {time} seconds."
  no_mana: "&cYou don't have enough mana. You need {mana}."
  in_combat: "&cYou can't use this skill in combat."
  learned: "&aYou learned the skill &e{skill}&a!"
  max_level: "&eThis skill is already at its maximum level."

# Profession system
profession:
  learned: "&aYou learned the profession: &e{profession}"
  max_professions: "&cYou already have the maximum number of professions allowed ({max})."
  dropped: "&eYou dropped the profession: &e{profession}"
  cannot_drop: "&cYou can't drop professions."
  exp_gained: "&a+{exp} EXP in {profession}"
  level_up: "&aYour &e{profession}&a level went up to &e{level}&a!"

# Combat system
combat:
  entered: "&cYou entered combat!"
  exited: "&aYou are no longer in combat."
  critical_hit: "&eCritical hit! &6{damage} damage"
  killed_by: "&cYou were killed by {killer}"

# Quest system
quest:
  started: "&aYou started the quest: &e{quest}"
  completed: "&aQuest completed! &e{quest}"
  failed: "&cQuest failed: &e{quest}"
  objective_progress: "&e{quest}: &a{current}/{total} {objective}"
  reward_received: "&aReward received: &e{reward}"

# Errors and warnings
error:
  database: "&cDatabase error. Contact an administrator."
  internal: "&cInternal server error."
  invalid_player: "&cPlayer not found."
  command_failed: "&cFailed to execute the command."
  player_offline: "&cPlayer not found or offline: {player}"
  no_rpg_data: "&cThat player doesn't have RPG data loaded."
  load_data: "&cError loading your data."

# /rpg addxp command
addxp:
  usage: "&cUsage: /rpg addxp <player> <amount>"
  invalid_amount: "&cThe XP amount must be a valid number."
  negative_amount: "&cThe XP amount must be positive."
  player_not_found: "&cPlayer not found: {player}"
  data_load_error: "&cError loading player data."
  success_admin: "&a✔ Added {amount} XP to {player}"
  notify_target: "&eAn administrator added {amount} XP to you&r&a. Your total XP is now: {total}"
  summary: "&bTotal XP: {total}&r&b | Level: {level}"
  error: "&cError adding experience."

# Commands - Help
help:
  header: "&6=== RPGRoll Help ==="
  footer: "&6======================"
  rpg_stats: "&e/rpg stats &7- View your stats"
  rpg_level: "&e/rpg level &7- View your level and experience"
  rpg_class: "&e/rpg class [name] &7- View or change your class"
  rpg_race: "&e/rpg race [name] &7- View or change your race"
  rpg_skills: "&e/rpg skills &7- View your skills"
  rpg_reload: "&e/rpg reload &7- Reload configuration (admin)"

# Central command manager (/rpg <sub>, help, generic errors)
command_manager:
  unknown_subcommand: "&cUnknown subcommand: {input}"
  use_help: "&eUse /rpg help to see the available commands."
  help_header: "&6========== RPGRoll - Help =========="
  help_footer: "&6====================================="

# /rpg admin job command
admin_job:
  usage: "&cUsage: {usage}"
  invalid_action: "&cInvalid action: give, remove, setlevel"
  give_usage: "&cUsage: /rpg job give <player> <jobId>"
  job_not_found: "&cThat job doesn't exist: {job}"
  already_has_job: "&eThat player already has that job."
  jobs_full: "&cThat player already has the maximum number of jobs (3). Use remove first."
  give_success: "&a✔ Job assigned: &6{job}&a to {player}"
  remove_usage: "&cUsage: /rpg job remove <player> <jobId>"
  remove_no_job: "&eThat player doesn't have that job."
  remove_success: "&a✔ Job removed from {player}"
  setlevel_usage: "&cUsage: /rpg job setlevel <player> <jobId> <level>"
  invalid_level_number: "&cLevel must be a number."
  invalid_level_range: "&cInvalid level. Maximum: {max}"
  no_active_job: "&cThat player doesn't have that job active."
  setlevel_success: "&a✔ {job} level for {player} set to {level}"

# /rpg admin setclass command
admin_setclass:
  usage: "&cUsage: {usage}"
  class_not_found: "&cThat class doesn't exist: {class}"
  success: "&a✔ {player}'s class changed to: &6{class}"
  stats_recalculated: "&e  (stats recalculated from scratch)"
  stats_unmodified: "&7  (stats unchanged — use --recalc to recalculate them)"
  notify_target: "&eAn administrator changed your class to: &6{class}"
  error: "&cError changing the class."

# /rpg admin setrace command
admin_setrace:
  usage: "&cUsage: {usage}"
  race_not_found: "&cThat race doesn't exist: {race}"
  success: "&a✔ {player}'s race changed to: &6{race}"
  notify_target: "&eAn administrator changed your race to: &6{race}"
  error: "&cError changing the race."

# /rpg admin resetstats command
admin_resetstats:
  usage: "&cUsage: {usage}"
  success: "&a✔ {player}'s stats have been reset. {points} stat point(s) available to reassign."
  notify_target: "&eAn administrator reset your stats. You have {points} point(s) to reassign with /rpg allocate."
  error: "&cError resetting the stats."

# /rpg stats command
stats_command:
  not_found: "&cCouldn't find your character's data."
  error: "&cError loading your stats."

# /rpg traits command
traits_command:
  not_found: "&cCouldn't find your player profile."
  error: "&cError loading your traits."
  header: "&6============== Your Traits =============="
  none: "&eYou haven't acquired any traits yet."
