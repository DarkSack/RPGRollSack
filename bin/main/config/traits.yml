# Traits (Rasgos especiales) disponibles en RPGRoll
# Los traits dan bonificaciones pasivas permanentes

traits:
  # TRAIT BÁSICOS (Nivel 1)
  sharp_mind:
    name: "Mente Perspicaz"
    description: "Aumenta tu inteligencia natural"
    required_level: 1
    effect:
      intelligence_bonus: 2
      mana_bonus: 10

  swift_feet:
    name: "Pies Ligeros"
    description: "Mejora tu agilidad y velocidad"
    required_level: 1
    effect:
      dexterity_bonus: 2
      defense_bonus: 0.05

  iron_skin:
    name: "Piel de Hierro"
    description: "Tu cuerpo se vuelve más resistente"
    required_level: 1
    effect:
      constitution_bonus: 2
      health_bonus: 20

  # TRAITS INTERMEDIOS (Nivel 5+)
  warriors_resolve:
    name: "Determinación del Guerrero"
    description: "Aumenta tu fuerza y resistencia"
    required_level: 5
    effect:
      strength_bonus: 3
      health_bonus: 30
      damage_bonus: 0.1

  mystical_affinity:
    name: "Afinidad Mística"
    description: "Sintonizas mejor con la magia"
    required_level: 5
    effect:
      intelligence_bonus: 3
      wisdom_bonus: 1
      mana_bonus: 30

  shadow_dancer:
    name: "Bailarín de Sombras"
    description: "Dominas el movimiento en la oscuridad"
    required_level: 5
    effect:
      dexterity_bonus: 4
      defense_bonus: 0.1

  divine_blessing:
    name: "Bendición Divina"
    description: "Eres tocado por poderes sagrados"
    required_level: 5
    effect:
      wisdom_bonus: 3
      charisma_bonus: 2
      health_bonus: 25

  # TRAITS AVANZADOS (Nivel 15+)
  dragon_heritage:
    name: "Herencia Dracónica"
    description: "Llevas sangre de dragón en tus venas"
    required_level: 15
    effect:
      strength_bonus: 4
      constitution_bonus: 3
      damage_bonus: 0.2
      health_bonus: 50

  arcane_master:
    name: "Maestría Arcana"
    description: "Controlas la magia a un nivel experto"
    required_level: 15
    effect:
      intelligence_bonus: 5
      wisdom_bonus: 2
      mana_bonus: 60
      damage_bonus: 0.15

  legend_of_old:
    name: "Leyenda de Antaño"
    description: "Eres recordado en historias antiguas"
    required_level: 20
    effect:
      strength_bonus: 2
      dexterity_bonus: 2
      constitution_bonus: 2
      intelligence_bonus: 2
      wisdom_bonus: 2
      charisma_bonus: 2
      health_bonus: 40
      mana_bonus: 40
      damage_bonus: 0.25
      defense_bonus: 0.15

  # TRAITS ESPECIALIZADOS POR CLASE
  barbarian_rage:
    name: "Ira Bárbara"
    description: "Tu rabia te hace más fuerte en combate (Guerrero)"
    required_level: 10
    effect:
      strength_bonus: 5
      damage_bonus: 0.3

  arcane_intellect:
    name: "Intelecto Arcano"
    description: "Tu conexión mágica se profundiza (Mago)"
    required_level: 10
    effect:
      intelligence_bonus: 4
      mana_bonus: 50

  assassin_training:
    name: "Entrenamiento de Asesino"
    description: "Dominas el arte del ataque letal (Pícaro)"
    required_level: 10
    effect:
      dexterity_bonus: 4
      damage_bonus: 0.25

  healer_touch:
    name: "Toque del Sanador"
    description: "Tu poder curativo es más potente (Clérigo)"
    required_level: 10
    effect:
      wisdom_bonus: 4
      charisma_bonus: 2

  sacred_bond:
    name: "Vínculo Sagrado"
    description: "Te unen fuerzas celestiales (Paladín)"
    required_level: 10
    effect:
      strength_bonus: 3
      wisdom_bonus: 3
      defense_bonus: 0.15

  nature_harmony:
    name: "Armonía con la Naturaleza"
    description: "La naturaleza responde a tu voluntad (Druida)"
    required_level: 10
    effect:
      wisdom_bonus: 3
      dexterity_bonus: 2
      health_bonus: 30
