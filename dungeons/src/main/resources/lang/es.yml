# Mensajes de RPGRoll-Dungeons (idioma: Español)
# Editá este archivo libremente — tus cambios se conservan tras un /dungeonadmin reload.
# Placeholders con {llave} se reemplazan por valores dinámicos donde se indique.

common:
  "yes": "sí"
  "no": "no"

prompt:
  footer: "&7Escribí en el chat, o '{keyword}' para abortar."
  cancel_keyword: "cancelar"
  cancelled: "&cCancelado."

command:
  dungeon:
    usage: "&eUso: /dungeon <list|info|invite|accept|decline|leaveparty|enter|leave|revive|ranking> [args]"
    not_found: "&cNo existe la mazmorra '{id}'."
    player_not_found: "&cJugador no encontrado."
    not_in_run: "&cNo estás en ninguna corrida."
    list:
      header: "&6=== Mazmorras ({count}) ==="
      occupied: "&c[ocupada]"
      free: "&a[libre]"
    info:
      usage: "&eUso: /dungeon info <id>"
      stats: "&7Nivel recomendado: {level} | Jugadores: {min}-{max} | Duración estimada: {minutes} min"
      rooms: "&7Salas: {rooms} | Repetible: {repeatable}"
      difficulties: "&7Dificultades: {difficulties}"
    invite:
      players_only: "&cSolo un jugador puede invitar."
      usage: "&eUso: /dungeon invite <jugador>"
      sent: "&a✔ Invitación enviada a {target}."
      received: "&e{inviter} te invitó a su grupo de mazmorra — /dungeon accept (60s)"
      failed: "&cNo se pudo invitar: {result}"
    accept:
      ok: "&a✔ Te uniste al grupo."
      no_invite: "&cNo tenés ninguna invitación pendiente."
      expired: "&cEsa invitación ya expiró."
      team_gone: "&cEse grupo ya no existe."
      team_full: "&cEse grupo ya está lleno."
    decline:
      ok: "&7Invitación rechazada."
    leaveparty:
      disbanded: "&7Grupo disuelto."
      left: "&7Saliste del grupo."
    enter:
      players_only: "&cSolo un jugador puede entrar a una mazmorra."
      usage: "&eUso: /dungeon enter <id> [dificultad]"
      not_leader: "&cSolo el líder del grupo puede iniciar la mazmorra."
      queued: "&eLa mazmorra está ocupada — tu grupo quedó en cola."
      already_running: "&cTu grupo ya está en una corrida."
      party_too_small: "&cSe necesitan al menos {min} jugador(es)."
      party_too_large: "&cEl grupo excede el máximo de {max} jugador(es)."
      on_cooldown: "&cAlguien del grupo todavía está en cooldown para esta mazmorra."
      difficulty_not_found: "&cNo existe la dificultad '{difficulty}'."
    leave:
      ok: "&7Abandonaste la mazmorra."
    revive:
      usage: "&eUso: /dungeon revive <jugador>"
      ok: "&a✔ Revivido."
      not_dead: "&cEse jugador no está muerto en esta corrida."
    ranking:
      usage: "&eUso: /dungeon ranking <id> [daily|weekly|monthly|global]"
      empty: "&7Todavía no hay corridas registradas."
      entry: "&7{position}. {players} — {seconds}s, {deaths} muerte(s)"
  dungeonadmin:
    no_permission: "&cNo tenés permiso para usar este comando."
    usage: "&eUso: /dungeonadmin <create|reload|forcestop|browser|editor|structure> [args]"
    players_only: "&cSolo un jugador puede abrir el editor."
    not_found: "&cNo existe la mazmorra '{id}'."
    create:
      usage: "&eUso: /dungeonadmin create <id>"
      id_taken: "&cYa existe una mazmorra con ese id."
      ok: "&a✔ Mazmorra '{id}' creada — abrila con /dungeonadmin editor {id} (o /dungeonadmin browser) para configurarla."
    reload:
      ok: "&a✔ Recargado: {dungeons} mazmorra(s), {structures} estructura(s)."
    forcestop:
      usage: "&eUso: /dungeonadmin forcestop <id>"
      no_run: "&cEsa mazmorra no tiene ninguna corrida activa."
      ok: "&a✔ Corrida detenida."
    editor:
      usage: "&eUso: /dungeonadmin editor <id>"
    structure:
      usage: "&eUso: /dungeonadmin structure <list|info|paste|import|importschem|browser> [args]"
      not_found: "&cNo existe una estructura con id: {id}"
      list:
        header: "&6Biblioteca de Estructuras ({count}):"
        entry: "&f• {id} ({source}) — {name}"
      info:
        usage: "&eUso: /dungeonadmin structure info <id>"
        unreadable_nbt: "(no se pudo leer el archivo)"
        source: "&fFuente: {source}"
        size: "&fTamaño (X·Y·Z): {size}"
      paste:
        usage: "&eUso: /dungeonadmin structure paste <id> [mundo x y z] [rotacion]"
        world_not_found: "&cNo existe el mundo: {world}"
        invalid_coords: "&cCoordenadas inválidas."
        console_needs_coords: "&cDesde consola hace falta pasar mundo y coordenadas: structure paste <id> <mundo> <x> <y> <z>"
        invalid_rotation: "&cRotación inválida — usá NONE, CLOCKWISE_90, CLOCKWISE_180 o COUNTERCLOCKWISE_90."
        ok: "&a✔ Estructura '{id}' pegada."
        failed: "&c✘ No se pudo pegar la estructura — revisá la consola."
      import:
        usage: "&eUso: /dungeonadmin structure import <nombreVanilla> <nuevoId> [nombre visible...]"
        usage_hint: "&7nombreVanilla es el nombre que le pusiste al Structure Block al guardar (ej. rpgroll:sala1)."
        ok: "&a✔ Estructura '{id}' importada a la Biblioteca."
        id_taken: "&cYa existe una estructura con ese id."
        vanilla_not_found: "&cNo se encontró ninguna estructura vanilla guardada como '{name}'."
        io_error: "&cError de I/O al importar — revisá la consola."
      importschem:
        usage: "&eUso: /dungeonadmin structure importschem <archivo.schem> <nuevoId> [nombre visible...]"
        usage_hint: "&7archivo es el nombre del .schem en la carpeta schematics/ de WorldEdit (el mismo que usaste con //schematic save)."
        ok: "&a✔ Schematic importado como estructura '{id}'."
        id_taken: "&cYa existe una estructura con ese id."
        worldedit_missing: "&cEsto requiere WorldEdit instalado y habilitado en el servidor."
        file_not_found: "&cNo se encontró el schematic '{file}' en la carpeta schematics/ de WorldEdit."
        io_error: "&cError de I/O al importar el schematic — revisá la consola."
      browser:
        players_only: "&cSolo un jugador puede abrir la Biblioteca de Estructuras."

