# Mensagens do RPGRoll-Dungeons (idioma: Português do Brasil)
# Edite este arquivo livremente — suas alterações são preservadas após um /dungeonadmin reload.
# Placeholders com {chave} são substituídos por valores dinâmicos onde indicado.

common:
  "yes": "sim"
  "no": "não"

prompt:
  footer: "&7Escreva no chat, ou '{keyword}' para cancelar."
  cancel_keyword: "cancelar"
  cancelled: "&cCancelado."

command:
  dungeon:
    usage: |-
      &eUso: /dungeon
      &7 • &flist
      &7 • &finfo
      &7 • &finvite
      &7 • &faccept
      &7 • &fdecline
      &7 • &fleaveparty
      &7 • &fenter
      &7 • &fleave
      &7 • &frevive
      &7 • &franking
    not_found: "&cA masmorra '{id}' não existe."
    player_not_found: "&cJogador não encontrado."
    not_in_run: "&cVocê não está em nenhuma corrida."
    list:
      header: "&6=== Masmorras ({count}) ==="
      occupied: "&c[ocupada]"
      free: "&a[livre]"
    info:
      usage: "&eUso: /dungeon info <id>"
      stats: "&7Nível recomendado: {level} | Jogadores: {min}-{max} | Duração estimada: {minutes} min"
      rooms: "&7Salas: {rooms} | Repetível: {repeatable}"
      difficulties: "&7Dificuldades: {difficulties}"
    invite:
      players_only: "&cSó um jogador pode convidar."
      usage: "&eUso: /dungeon invite <jogador>"
      sent: "&a✔ Convite enviado para {target}."
      received: "&e{inviter} te convidou para o grupo de masmorra — /dungeon accept (60s)"
      failed: "&cNão foi possível convidar: {result}"
    accept:
      ok: "&a✔ Você entrou no grupo."
      no_invite: "&cVocê não tem nenhum convite pendente."
      expired: "&cEsse convite já expirou."
      team_gone: "&cEsse grupo não existe mais."
      team_full: "&cEsse grupo já está cheio."
    decline:
      ok: "&7Convite recusado."
    leaveparty:
      disbanded: "&7Grupo desfeito."
      left: "&7Você saiu do grupo."
    enter:
      players_only: "&cSó um jogador pode entrar em uma masmorra."
      usage: "&eUso: /dungeon enter <id> [dificuldade]"
      not_leader: "&cSó o líder do grupo pode iniciar a masmorra."
      queued: "&eA masmorra está ocupada — seu grupo entrou na fila."
      already_running: "&cSeu grupo já está em uma corrida."
      party_too_small: "&cSão necessários pelo menos {min} jogador(es)."
      party_too_large: "&cO grupo excede o máximo de {max} jogador(es)."
      on_cooldown: "&cAlguém do grupo ainda está em cooldown para esta masmorra."
      difficulty_not_found: "&cA dificuldade '{difficulty}' não existe."
    leave:
      ok: "&7Você abandonou a masmorra."
    revive:
      players_only: "&cSó um jogador pode reviver um companheiro."
      usage: "&eUso: /dungeon revive <jogador>"
      ok: "&a✔ Revivido."
      not_dead: "&cEsse jogador não está morto nesta corrida."
    ranking:
      usage: "&eUso: /dungeon ranking <id> [daily|weekly|monthly|global]"
      empty: "&7Ainda não há corridas registradas."
      entry: "&7{position}. {players} — {seconds}s, {deaths} morte(s)"
  dungeonadmin:
    no_permission: "&cVocê não tem permissão para usar este comando."
    usage: |-
      &eUso: /dungeonadmin
      &7 • &fcreate
      &7 • &freload
      &7 • &fforcestop
      &7 • &fbrowser
      &7 • &feditor
      &7 • &fstructure
    players_only: "&cSó um jogador pode abrir o editor."
    not_found: "&cA masmorra '{id}' não existe."
    create:
      usage: "&eUso: /dungeonadmin create <id>"
      id_taken: "&cJá existe uma masmorra com esse id."
      ok: "&a✔ Masmorra '{id}' criada — abra com /dungeonadmin editor {id} (ou /dungeonadmin browser) para configurá-la."
    reload:
      ok: "&a✔ Recarregado: {dungeons} masmorra(s), {structures} estrutura(s)."
    forcestop:
      usage: "&eUso: /dungeonadmin forcestop <id>"
      no_run: "&cEssa masmorra não tem nenhuma corrida ativa."
      ok: "&a✔ Corrida interrompida."
    editor:
      usage: "&eUso: /dungeonadmin editor <id>"
    structure:
      usage: "&eUso: /dungeonadmin structure <list|info|paste|import|importschem|browser> [args]"
      not_found: "&cNão existe uma estrutura com id: {id}"
      list:
        header: "&6Biblioteca de Estruturas ({count}):"
        entry: "&f• {id} ({source}) — {name}"
      info:
        usage: "&eUso: /dungeonadmin structure info <id>"
        unreadable_nbt: "(não foi possível ler o arquivo)"
        source: "&fFonte: {source}"
        size: "&fTamanho (X·Y·Z): {size}"
      paste:
        usage: "&eUso: /dungeonadmin structure paste <id> [mundo x y z] [rotação]"
        world_not_found: "&cO mundo não existe: {world}"
        invalid_coords: "&cCoordenadas inválidas."
        console_needs_coords: "&cPelo console é preciso informar mundo e coordenadas: structure paste <id> <mundo> <x> <y> <z>"
        invalid_rotation: "&cRotação inválida — use NONE, CLOCKWISE_90, CLOCKWISE_180 ou COUNTERCLOCKWISE_90."
        ok: "&a✔ Estrutura '{id}' colada."
        failed: "&c✘ Não foi possível colar a estrutura — verifique o console."
      import:
        usage: "&eUso: /dungeonadmin structure import <nomeVanilla> <novoId> [nome visível...]"
        usage_hint: "&7nomeVanilla é o nome que você deu ao Structure Block ao salvar (ex. rpgroll:sala1)."
        ok: "&a✔ Estrutura '{id}' importada para a Biblioteca."
        id_taken: "&cJá existe uma estrutura com esse id."
        vanilla_not_found: "&cNenhuma estrutura vanilla encontrada salva como '{name}'."
        io_error: "&cErro de I/O ao importar — verifique o console."
      importschem:
        usage: "&eUso: /dungeonadmin structure importschem <arquivo.schem> <novoId> [nome visível...]"
        usage_hint: "&7arquivo é o nome do .schem na pasta schematics/ do WorldEdit (o mesmo usado com //schematic save)."
        ok: "&a✔ Schematic importado como estrutura '{id}'."
        id_taken: "&cJá existe uma estrutura com esse id."
        worldedit_missing: "&cIsso requer o WorldEdit instalado e habilitado no servidor."
        file_not_found: "&cSchematic '{file}' não encontrado na pasta schematics/ do WorldEdit."
        io_error: "&cErro de I/O ao importar o schematic — verifique o console."
      browser:
        players_only: "&cSó um jogador pode abrir a Biblioteca de Estruturas."

