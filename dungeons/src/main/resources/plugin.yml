name: RPGRoll-Dungeons
version: 1.0.0
main: com.sack.rpgroll.dungeons.DungeonsPlugin
api-version: "26.1.1"
author: Sack
description: Motor de mazmorras instanciadas (salas, oleadas, jefes, objetivos, loot, dificultades, ranking) para RPGRoll
depend: [RPGRoll, RPGRoll-Mobs, RPGRoll-Guilds]
softdepend: [RPGRoll-Items, RPGRoll-Quests, PlaceholderAPI]

commands:
  dungeon:
    description: Comandos de mazmorras para jugadores
    usage: /dungeon <list|info|invite|accept|decline|leaveparty|enter|leave|revive|ranking> [args]
  dungeonadmin:
    description: Comandos administrativos de mazmorras
    usage: /dungeonadmin <create|reload|forcestop|browser|editor|structure> [args]
    permission: rpgrolldungeons.admin.*

permissions:
  rpgrolldungeons.admin.*:
    description: Acceso completo a comandos administrativos de mazmorras
    default: op
