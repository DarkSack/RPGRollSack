# Carpeta (relativa a plugins/SackResourcePack/) donde cada módulo tiene su
# propio pack.yml + assets/ — ver la documentación para el formato exacto.
content-directory: content

http:
  # Servidor HTTP embebido (com.sun.net.httpserver, sin dependencias extra)
  # que sirve resourcepack.zip — la opción más simple, cero configuración.
  enabled: true
  bind-address: 0.0.0.0
  port: 8080
  path: /resourcepack.zip
  # Si tenés el pack hosteado en otro lado (nginx, un bucket, un CDN...),
  # completá esto y se manda esa URL en vez de la del servidor embebido.
  public-url: ""

# pack_format del pack.mcmeta generado — 34 corresponde a 1.21-1.21.1.
# Si tu servidor corre otra versión, ajustalo acá (ver la wiki de Minecraft
# para el pack_format correcto de tu versión exacta).
pack-format: 34

# Cada asset nuevo (modelo/textura/etc.) recibe un CustomModelData estable,
# asignado una sola vez y persistido en cmd-registry.yml — nunca cambia
# entre builds. Este es el primer número que se usa.
custom-model-data-base: 10000

# Subida a un endpoint remoto además del host embebido.
# mode: "generic" = PUT/POST autenticado con un header fijo (endpoint
#                    propio, un proxy, o cualquier servicio que lo acepte).
# mode: "s3"      = firma un PUT real con AWS Signature V4 (ver la sección
#                    's3' más abajo) — para hablarle directo a un bucket S3
#                    o cualquier proveedor S3-compatible (MinIO, R2, B2...).
remote-upload:
  enabled: false
  mode: generic
  url: ""
  method: PUT
  auth-header-name: "Authorization"
  auth-header-value: ""

# Solo se usa si remote-upload.mode es "s3".
s3:
  # Host del proveedor (ej. "s3.amazonaws.com", "s3.us-west-002.backblazeb2.com", o el host:puerto de un MinIO propio).
  endpoint: ""
  bucket: ""
  region: "us-east-1"
  object-key: "resourcepack.zip"
  access-key: ""
  secret-key: ""
  # true = https://endpoint/bucket/key (MinIO y varios proveedores no-AWS lo requieren)
  # false = https://bucket.endpoint/key (estilo "virtual-hosted", el de AWS por defecto)
  path-style: false

distribution:
  required: false
  prompt-message: "&6Este servidor usa un resource pack personalizado."

# Modo de desarrollo: un watcher sobre content/ reconstruye y reenvía el
# pack automáticamente apenas guardás un cambio. Podés dejarlo prendido
# siempre, o alternarlo con /srp dev.
development-mode: false

# Datapack (data/ de cada módulo: tags, loot tables, recipes, functions...)
# — distinto de un resource pack: vive server-side en
# <mundo>/datapacks/<name>/, nunca se manda al cliente. "enabled" solo
# controla si /srp datapack build hace algo; nunca se aplica solo, siempre
# hace falta /srp datapack reload aparte (ver Server#reloadData()).
datapack:
  enabled: false
  name: sackresourcepack
  # pack_format de datapack — NO comparte numeración con el pack-format de
  # resource pack de más arriba, son escalas independientes.
  pack-format: 48
