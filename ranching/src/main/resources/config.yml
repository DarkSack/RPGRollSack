# Idioma de los mensajes del plugin (es, en, pt_BR). Los archivos de idioma
# viven en lang/<codigo>.yml dentro de la carpeta de datos del plugin.
language: es

# Cómo se calculan los genes de una cría a partir de sus padres:
#   SIMPLE          - promedio de ambos padres +/- una pequeña variación al azar, sin dominancia.
#   ADVANCED        - dominancia real por alelo (dominante/recesivo/mixto), como un cuadro de Punnett.
#   PROBABILISTIC   - igual que ADVANCED, pero antes de aparear se puede consultar la distribución de
#                     probabilidad completa (ver Breeding Planner) en vez de solo el resultado final.
genetics-mode: ADVANCED

# Probabilidad (0.0-1.0) de que una cría desarrolle una mutación rara al nacer.
mutation-chance: 0.01

# Cuántas generaciones hacia atrás se revisan al planear un cruce para avisar de endogamia.
inbreeding-warning-generations: 3

# Intervalos de tareas periódicas, en ticks (20 ticks = 1 segundo).
growth-check-interval-ticks: 200
welfare-check-interval-ticks: 200
health-check-interval-ticks: 200
pregnancy-check-interval-ticks: 100
production-check-interval-ticks: 100

# Radio (bloques) en el que una enfermedad contagiosa puede propagarse a animales cercanos.
disease-contagion-radius: 6.0

# Modelo 3D de cada producto, por tipo (el de product-types de las especies). Un texto = el mismo
# modelo para todas las calidades; una sección = "default" más uno por calidad (COMMON, GOOD,
# PREMIUM, ORGANIC, LEGENDARY). Borra una línea para dejar el ítem vanilla.
product-models:
  milk:
    default: rpgroll_ranching:product/milk
    LEGENDARY: rpgroll_ranching:product/milk_legendary
  wool:
    default: rpgroll_ranching:product/wool
    LEGENDARY: rpgroll_ranching:product/wool_legendary
  eggs:
    default: rpgroll_ranching:product/egg
    LEGENDARY: rpgroll_ranching:product/egg_legendary
  meat: rpgroll_ranching:product/meat
  leather: rpgroll_ranching:product/leather
  horns: rpgroll_ranching:product/horns
  feathers: rpgroll_ranching:product/feathers

# Lo que paga por unidad el comprador de RPGRoll-Economy por cada producto (el tipo de product-types),
# antes de la calidad. Un tipo sin precio no se le puede vender.
product-prices:
  milk: 6
  wool: 3
  eggs: 1.5
  meat: 4
  leather: 3
  horns: 5
  feathers: 1
  fur: 2

# Multiplicador del precio según la calidad del producto.
product-quality-multipliers:
  COMMON: 1.0
  GOOD: 1.25
  PREMIUM: 1.6
  ORGANIC: 2.0
  LEGENDARY: 3.5

# --- Dueños, corral y mercado de animales ---
# Cada animal tiene dueño: el que lo compra, lo cría (las crías son de quien era
# la madre) o lo reclama. /ranching animales abre la lista para llamarlos, mandarlos
# al corral (/ranching corral fijar) o ponerlos a la venta.
ownership:
  # Solo el dueño ordeña, esquila, alimenta, cura, cría, ata o hace daño a sus
  # animales (rpgrollranching.bypass-owner se lo salta). Los animales sin dueño
  # no se protegen.
  protect: true
  # /ranching reclamar sobre un animal sin dueño (los de antes de esta versión).
  claim-unowned: true
  # Máximo de animales por jugador al comprar o reclamar (0 = sin límite). Las
  # crías no cuentan para el límite.
  max-animals-per-player: 0

recall:
  # Segundos entre llamadas (llamar o mandar al corral).
  cooldown-seconds: 5
  # Si se puede llamar a un animal que está en otro mundo.
  cross-world: true
  # Si la entidad de un animal ya no existe (la borró un comando, un plugin de
  # limpieza, un chunk regenerado...), crear una nueva con sus mismos datos.
  recreate-missing: true

# Compraventa con dinero de Vault. Sin Vault el mercado avisa y no cobra.
market:
  enabled: true
  min-price: 1
  max-price: 1000000
  # Porcentaje que se queda el servidor en las ventas entre jugadores.
  tax-percent: 0
  # Animales que vende el servidor: fundadores nuevos, del comprador, a sus pies.
  # sex: MALE, FEMALE o RANDOM.
  server-shop:
    - {species: cow, breed: holstein, sex: RANDOM, price: 250}
    - {species: sheep, breed: merino, sex: RANDOM, price: 150}
    - {species: chicken, breed: leghorn, sex: RANDOM, price: 40}
    - {species: pig, breed: yorkshire, sex: RANDOM, price: 180}
    - {species: rabbit, breed: californian, sex: RANDOM, price: 35}
    - {species: duck, breed: pekin, sex: RANDOM, price: 45}
    - {species: goat, breed: saanen, sex: RANDOM, price: 160}
  # Lo que paga el servidor por un animal propio, por especie, multiplicado por
  # su calidad (POOR 0.5, COMMON 1, GOOD 1.5, EXCELLENT 2.5, EXCEPTIONAL 5).
  sell-to-server:
    cow: 100
    sheep: 60
    chicken: 15
    pig: 70
    rabbit: 12
    duck: 18
    goat: 65

# Un secreto: el huevo fosilizado. Lo pone muy de vez en cuando una gallina (o pato)
# del rancho en lugar de un huevo, y a veces lo desentierra un sniffer. Usado sobre
# un bloque, se incuba y sale un mini T-Rex del jugador. 0 lo desactiva.
secret:
  dino-egg-chance: 0.0005
  sniffer-dino-egg-chance: 0.02
  species: trex
  breed: tiranosaurio

resource-pack:
  # Registrar los modelos de fábrica en SackResourcePack al arrancar (si está instalado).
  register-in-sackresourcepack: true
